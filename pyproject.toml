[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gea-program"
version = "0.10.0"
description = "GEA-Program: downhole gauge monitoring - canonical measurement records, quality rules, drift evaluation with a re-fit change log, well-test validation, alarm management, model cards, store-and-forward, monthly SLA measurement, FAT/SAT protocols and a dashboard, generated from live objects in the client's reporting outline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel T. Murphy" }]
license = { text = "MPL-2.0" }
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]
desktop = ["PyQt6>=6.5", "matplotlib>=3.7"]
modbus = ["pymodbus>=3.0"]
opcua = ["asyncua>=1.0"]
mqtt = ["paho-mqtt>=2.0"]
serial = ["pyserial>=3.5"]
live = ["asyncua>=1.0", "paho-mqtt>=2.0", "pymodbus>=3.0", "pyserial>=3.5"]
xls = ["xlrd>=2.0"]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/GEA-Program"
Source = "https://github.com/Daniel8Murphy0007/GEA-Program"

[project.scripts]
gea = "gea.cli:main"

[tool.setuptools]
packages = ["gea"]

[tool.setuptools.package-data]
gea = ["catalog/*", "web/*", "help/*", "reference/*", "sample_well_profile.csv", "example_register_map.json", "BENCH_TEST_PROTOCOL.md"]
