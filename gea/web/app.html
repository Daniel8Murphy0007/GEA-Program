<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEA-Program</title>
<style>
:root{color-scheme:light;--page:#f6f5f0;--surface:#fff;--ink:#141412;--ink2:#3d3c37;--muted:#77756e;--grid:#e3e1d8;--ring:rgba(0,0,0,.08);--accent:#1f5fb8;--accent-ink:#fff;--good:#1d7a4a;--warn:#a86a00;--serious:#b3261e;--track:#dfe8f7;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);--accent:#3987e5;--good:#5ec48f;--warn:#e2a93b;--serious:#ee6a62;--track:#1f2f44}}
:root[data-theme=dark]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);--accent:#3987e5;--good:#5ec48f;--warn:#e2a93b;--serious:#ee6a62;--track:#1f2f44}
*{box-sizing:border-box}html{font-size:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--grid)}
header h1{font-size:18px;margin:0 8px 0 0}header .site{color:var(--muted)}header .spacer{flex:1}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--grid)}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink2)}nav a[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:8px 0 12px}h3{font-size:16px;margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px var(--ring)}
.tile .v{font-size:26px;font-weight:600;line-height:1.2}.tile .l{color:var(--muted);font-size:13px}.tile .n{font-size:13px;color:var(--ink2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px var(--ring)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}th{color:var(--muted);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}.status .i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.good{color:var(--good)}.good .i{background:var(--good)}.warn{color:var(--warn)}.warn .i{background:var(--warn);border-radius:2px}.serious{color:var(--serious)}.serious .i{background:var(--serious);border-radius:0;transform:rotate(45deg)}.neutral{color:var(--muted)}
button,.btn{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:var(--surface);color:var(--accent)}button.danger{background:var(--serious);border-color:var(--serious)}button[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row>*{margin:0}
label{display:block;font-size:13px;color:var(--ink2)}label>input,label>select,label>textarea{display:block;margin-top:3px;font:inherit;padding:6px 8px;border:1px solid var(--grid);border-radius:6px;background:var(--surface);color:var(--ink);min-width:160px}
textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:13px}
pre{background:var(--page);border:1px solid var(--grid);border-radius:8px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12.5px;max-height:420px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}.small{font-size:13px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast{background:var(--surface);border:1px solid var(--grid);border-left:5px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 4px 14px var(--ring);max-width:420px}
.toast.err{border-left-color:var(--serious)}.toast.ok{border-left-color:var(--good)}
.auth{max-width:420px;margin:60px auto}.auth label>input{width:100%}
svg.chart{width:100%;height:260px;display:block}svg.chart text{font:11px var(--sans);fill:var(--ink2)}svg.chart .grid{stroke:var(--grid)}svg.chart .line{fill:none;stroke:var(--accent);stroke-width:1.6}svg.chart .q{r:2.2}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:8px;z-index:10}
details summary{cursor:pointer;color:var(--accent)}
.apr{min-width:260px;max-width:100%;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (max-width:640px){main{padding:12px}label>input,label>select{min-width:0;width:100%}table{display:block;overflow-x:auto;white-space:nowrap}.row{align-items:stretch}.row>*{width:100%}header h1{font-size:16px}pre{max-width:100%}.apr{min-width:0}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <h1>GEA-Program</h1><span class="site" id="siteName"></span>
  <span class="spacer"></span>
  <span id="whoami" class="small muted"></span>
  <button class="secondary" id="themeBtn" type="button" aria-pressed="false">Dark theme</button>
  <button class="secondary" id="logoutBtn" type="button" hidden>Sign out</button>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main" tabindex="-1"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
// ---------- helpers -------------------------------------------------------------------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d=2) => (v === null || v === undefined || v === '') ? '—' : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(d)) : esc(v));
function toast(msg, kind='') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 7000); }
async function api(method, path, body) {
  const opt = {method, headers: {'Content-Type': 'application/json'}};
  if (method === 'POST') { opt.headers['X-GEA-Action'] = '1'; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(path, opt);
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(d.error || (r.status + ' ' + r.statusText)); err.status = r.status; throw err; }
  return d;
}
const get = p => api('GET', p), post = (p, b) => api('POST', p, b);
function statusPill(kind, text) { return `<span class="status ${kind}"><span class="i" aria-hidden="true"></span>${esc(text)}</span>`; }
function classKind(c) { c = String(c || ''); if (/UNEXPLAINED|NOT_ACCEPTABLE|FAILED|SERIOUS|BAD|P1|P2/.test(c)) return 'serious'; if (/OFFSET|BAND_2|BAND_3|STALE|WARN|PENDING|P3/.test(c)) return 'warn'; if (/IN_FAMILY|MEETS|DONE|GOOD|APPROVED|CURRENT|MET\b|ACCEPTED/.test(c)) return 'good'; return 'neutral'; }
function readFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }
const ROLE = {viewer:0, operator:1, approver:2, admin:3};
let me = null, workspaceName = '';
const can = r => me && ROLE[me.role] >= ROLE[r];
function need(r) { return can(r) ? '' : `<p class="muted small">Needs the ${r} role.</p>`; }
function reportLinks(dir, base) { return ['html','md','json','csv'].map(x => `<a href="/reports/${esc(dir)}/${esc(base)}.${x}" target="_blank" rel="noopener">${x}</a>`).join(' · '); }

// ---------- charts (inline SVG, no library) -------------------------------------------
function lineChart(index, values, quality, unit, label) {
  const W = 900, H = 260, L = 56, R = 12, T = 18, B = 34;
  const pts = index.map((x, i) => [x, values[i]]).filter(p => p[1] !== null && p[1] !== undefined);
  if (!pts.length) return `<p class="muted">no numeric samples</p>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.08 || 1;
  const sx = x => L + (x - x0) / ((x1 - x0) || 1) * (W - L - R), sy = y => T + (1 - (y - (y0 - pad)) / ((y1 + pad) - (y0 - pad))) * (H - T - B);
  let grid = '', labels = '';
  for (let k = 0; k <= 4; k++) { const y = (y0 - pad) + k * ((y1 + pad) - (y0 - pad)) / 4; grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}"/>`; labels += `<text x="${L - 6}" y="${sy(y) + 4}" text-anchor="end">${y.toFixed(Math.abs(y) < 10 ? 2 : 0)}</text>`; }
  for (let k = 0; k <= 5; k++) { const x = x0 + k * (x1 - x0) / 5; labels += `<text x="${sx(x)}" y="${H - 10}" text-anchor="middle">${(x / 3600).toFixed(1)} h</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join('');
  let marks = '';
  index.forEach((x, i) => { const q = quality && quality[i]; if (q && q !== 'OK' && q !== 'GOOD' && values[i] !== null) marks += `<circle class="q" cx="${sx(x).toFixed(1)}" cy="${sy(values[i]).toFixed(1)}" fill="var(--warn)"><title>${esc(q)} at ${(x/3600).toFixed(2)} h: ${values[i]}</title></circle>`; });
  const desc = `${label}: ${pts.length} samples from ${ys[0]} to ${ys[ys.length-1]} ${unit}; min ${y0}, max ${y1}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}"><title>${esc(desc)}</title>${grid}<path class="line" d="${d}"/>${marks}${labels}<text x="${L}" y="12">${esc(label)} (${esc(unit)}) — flagged samples marked</text></svg>`;
}

// ---------- views ---------------------------------------------------------------------
const VIEWS = {};
VIEWS.home = async () => {
  const o = await get('/api/overview'); const d = o.dashboard, ws = o.workspace, site = (d && d.site) || {};
  const nDrift = d ? d.wells.filter(w => w.drift && w.drift.detected).length : 0;
  const active = d ? d.wells.reduce((n, w) => n + ((w.alarms && w.alarms.active) || []).length, 0) : 0;
  const unacked = d ? d.wells.reduce((n, w) => n + ((w.alarms && w.alarms.active) || []).filter(a => a.state === 'ACTIVE_UNACKED').length, 0) : 0;
  const q = await get('/api/approvals');
  let h = `<h2>${esc(ws.name)}</h2><p class="muted small">Program ${esc(o.service.program_version)} · ${ws.n_wells} wells · service up since ${esc(o.service.started_utc)} · dashboard ${d ? 'generated ' + esc(d.generated_utc) : 'not yet generated'} · ${o.jobs_running.length} job(s) running</p>`;
  h += `<div class="tiles">`;
  h += tile('Wells with model drift detected', `${nDrift} of ${ws.n_wells}`, nDrift ? 'warn' : 'good', '#/wells');
  h += tile('Active alarms (unacknowledged)', `${active} (${unacked})`, unacked ? 'serious' : (active ? 'warn' : 'good'), '#/alarms');
  h += tile('Waiting for a decision', `${q.well_tests.length} tests · ${q.refits.length} re-fits`, (q.well_tests.length + q.refits.length) ? 'warn' : 'good', '#/approvals');
  if (site.accuracy) h += tile('Accuracy: quantities meeting 95 %', `${site.accuracy.bands.MEETS_TARGET || 0} of ${site.accuracy.n_ok}`, (site.accuracy.bands.NOT_ACCEPTABLE ? 'warn' : 'good'), '/reports/accuracy_statement.html', `${site.accuracy.pending} pending`);
  if (site.sla) h += tile(`SLA ${esc(site.sla.month)}`, `${site.sla.counts.MET||0} met / ${site.sla.counts['NOT MET']||0} not / ${site.sla.counts['NOT MEASURED']||0} n/m`, (site.sla.counts['NOT MET'] ? 'serious' : 'good'), site.sla.report ? '/reports/' + esc(site.sla.report.split('/reports/').pop()) : '#/reports');
  if (site.model_cards) h += tile('Model cards', site.model_cards.n, 'neutral', '#/reports');
  if (site.sbom) h += tile('Software bill of materials', site.sbom.n + ' components', 'neutral', '/reports/sbom.csv');
  const pc = o.patches || []; const pUp = pc.filter(p => p.status === 'CONNECTED').length, pBad = pc.filter(p => p.status === 'DOWN' || p.status === 'DEGRADED').length;
  h += tile('Patches connected', `${pUp} of ${pc.length}`, pBad ? 'serious' : (pc.length ? 'good' : 'neutral'), '#/live', pBad ? `${pBad} down or degraded` : '');
  h += `</div>`;
  h += `<div class="row card">${can('operator') ? `<label>Month for the SLA (optional)<input id="month" placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></label><label><input type="checkbox" id="sat"> also run the SAT protocol</label><button id="refreshBtn" type="button">Refresh every report</button>` : need('operator')}<a class="btn secondary" href="/reports/index.html" target="_blank" rel="noopener">Open the printed dashboard</a></div>`;
  if (d) {
    h += `<h3>Well ranking</h3><table><thead><tr><th>Well</th><th>Drift</th><th>Worst station</th><th>Bias max (psi)</th><th>Quality, worst tag GOOD %</th><th>Active alarms</th><th>Well tests</th></tr></thead><tbody>`;
    for (const w of d.wells) {
      const wt = w.well_tests || {};
      h += `<tr><td><a href="#/wells/${esc(w.slug)}">${esc(w.name)}</a></td><td>${w.drift ? statusPill(w.drift.detected ? 'warn' : 'good', w.drift.detected ? 'drift detected' : 'in family') : '—'}</td><td>${w.drift ? statusPill(classKind(w.drift.worst), w.drift.worst) : '—'}</td><td>${w.drift ? fmt(w.drift.bias_max) : '—'}</td><td>${w.quality ? fmt(w.quality.pct_good_min, 1) : '—'}</td><td>${w.alarms ? (w.alarms.active || []).length : '—'}</td><td>${wt.accepted !== undefined ? `${wt.accepted} accepted / ${wt.rejected} rejected` : '—'}</td></tr>`;
    }
    h += `</tbody></table>`;
  } else h += `<p class="card">No reports yet. Add a well, then refresh every report.</p>`;
  $('#main').innerHTML = h;
  const b = $('#refreshBtn'); if (b) b.onclick = async () => { b.disabled = true; try { const j = await post('/api/refresh', {month: $('#month').value || null, sat: $('#sat').checked}); toast('Refresh started: job ' + j.id, 'ok'); watch(j.id, () => route()); } catch (e) { toast(e.message, 'err'); } b.disabled = false; };
};
function tile(l, v, kind, href, note) { const inner = `<div class="l">${esc(l)}</div><div class="v ${kind}">${statusPill(kind, '')} ${esc(v)}</div>${note ? `<div class="n">${esc(note)}</div>` : ''}`; return `<a class="tile" href="${esc(href)}" style="text-decoration:none;color:inherit" ${href.startsWith('/reports') ? 'target="_blank" rel="noopener"' : ''}>${inner}</a>`; }

VIEWS.wells = async () => {
  const {wells} = await get('/api/wells');
  let h = `<h2>Wells</h2><table><thead><tr><th>Well</th><th>Kind</th><th>Source</th><th>Added</th><th></th></tr></thead><tbody>`;
  for (const w of wells) h += `<tr><td><a href="#/wells/${esc(w.id)}">${esc(w.display)}</a></td><td>${esc(w.kind)}</td><td class="small mono">${esc(w.kind === 'catalog' ? w.source.entry + ' / ' + w.source.well : (w.kind === 'live' ? w.source.port + ' · ' + w.source.config : (w.source.original_path || w.files[0])))}</td><td class="small">${esc(w.added_utc)} by ${esc(w.added_by)}</td><td>${can('admin') ? `<button class="secondary danger" data-remove="${esc(w.id)}" type="button">Remove</button>` : ''}</td></tr>`;
  h += `</tbody></table>`;
  if (can('operator')) {
    h += `<div class="card"><h3>Add a well from a file</h3><p class="small muted">Historian CSV export, LAS 2.0 log, operator table or SEG-Y. The file is copied into the workspace verbatim and hashed; your original is never touched.</p>
      <div class="row"><label>Display name<input id="fName"></label><label>File<input type="file" id="fFile"></label><label>Station MD (ft, optional)<input id="fMd" type="number" step="1"></label><button id="fAdd" type="button">Add file well</button></div></div>`;
    h += `<div class="card"><h3>Add a catalogue well</h3><p class="small muted">A public archive entry shipped with the program (52 entries, each with a provenance file).</p>
      <div class="row"><label>Entry<select id="cEntry"></select></label><label>Well tag inside the entry<input id="cWell" placeholder="15/9-F-12"></label><label>Station MD (ft)<input id="cMd" type="number" value="10000"></label><label>Display name (optional)<input id="cName"></label><button id="cAdd" type="button">Add catalogue well</button></div></div>`;
    h += `<div class="card"><h3>Add a live well</h3><p class="small muted">A well whose data arrives over the network: the site's own map for a WITS0 sender, a WITSML store, an OPC UA server, an MQTT broker or a Modbus device. Adding it also creates its patch on the Patch panel. Credentials are never in the map - only the names of the environment variables that hold them on the machine running the service.</p>
      <div class="row"><label>Display name<input id="lName"></label><label>Port<select id="lPort"><option value="wits0">WITS0 (drill floor)</option><option value="witsml">WITSML store</option><option value="opcua">OPC UA</option><option value="mqtt">MQTT</option><option value="modbus_g6">Modbus TCP</option></select></label><button class="secondary" id="lExample" type="button">Load the example map</button><button id="lAdd" type="button">Add live well</button></div>
      <label>Tag map (JSON)<textarea id="lCfg" spellcheck="false"></textarea></label></div>`;
  } else h += need('operator');
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => { if (!confirm(`Remove ${b.dataset.remove} from the workspace? Its folder is kept, renamed.`)) return; try { await post(`/api/wells/${b.dataset.remove}/remove`); toast('Removed', 'ok'); route(); } catch (e) { toast(e.message, 'err'); } });
  if (!can('operator')) return;
  const {entries} = await get('/api/catalog'); $('#cEntry').innerHTML = entries.map(e => `<option value="${esc(e.entry)}">${esc(e.entry)}</option>`).join('');
  $('#fAdd').onclick = async () => { const f = $('#fFile').files[0]; if (!f) return toast('Choose a file', 'err'); try { const w = await post('/api/wells/file', {display: $('#fName').value || f.name, filename: f.name, content_b64: await readFile(f), station_md: $('#fMd').value ? +$('#fMd').value : null}); toast(`Added ${w.id}`, 'ok'); location.hash = '#/wells/' + w.id; } catch (e) { toast(e.message, 'err'); } };
  $('#cAdd').onclick = async () => { try { const w = await post('/api/wells/catalog', {entry: $('#cEntry').value, well: $('#cWell').value, station_md: +$('#cMd').value, display: $('#cName').value || null}); toast(`Added ${w.id}`, 'ok'); location.hash = '#/wells/' + w.id; } catch (e) { toast(e.message, 'err'); } };
  $('#lExample').onclick = async () => { try { const d = await get('/api/config/defaults/' + $('#lPort').value); $('#lCfg').value = JSON.stringify(d.content, null, 1); } catch (e) { toast(e.message, 'err'); } };
  $('#lAdd').onclick = async () => { let cfg; try { cfg = JSON.parse($('#lCfg').value); } catch (e) { return toast('The tag map is not valid JSON', 'err'); } try { const w = await post('/api/wells/live', {display: $('#lName').value, port: $('#lPort').value, config: cfg}); toast(`Added ${w.id}`, 'ok'); location.hash = '#/wells/' + w.id; } catch (e) { toast(e.message, 'err'); } };
};

VIEWS.well = async (id) => {
  const d = await get('/api/wells/' + id); const w = d.well, R = d.reports, dir = 'wells/' + id;
  let h = `<h2>${esc(w.display)} <span class="muted small">(${esc(w.kind)})</span></h2>`;
  h += `<dl class="kv card"><dt>Source</dt><dd class="mono small">${esc(w.kind === 'catalog' ? w.source.entry + ' / ' + w.source.well + ' at MD ' + w.station_md_ft + ' ft' : (w.kind === 'live' ? w.source.port + ' · ' + w.source.config : (w.source.original_path || w.files[0]) + ' · sha256 ' + (w.source.sha256 || '').slice(0, 16)))}</dd><dt>Added</dt><dd>${esc(w.added_utc)} by ${esc(w.added_by)}</dd></dl>`;
  if (can('operator')) {
    h += `<div class="row card"><button id="runDrift" type="button">Run the drift report</button>${w.kind === 'file' ? `<button id="runAlarms" type="button">Process alarms</button>` : ''}${w.kind === 'live' ? `<label>Seconds<input id="tapSec" type="number" value="60" min="1"></label><button id="tapStart" type="button">Start the tap</button><button id="tapStop" class="secondary" type="button">Stop</button>` : ''}<span class="small muted">every run is a job with its own log</span></div>`;
  }
  // drift
  if (R.gauge_drift_report) { const ev = R.gauge_drift_report.evaluation, dq = R.gauge_drift_report.data_quality || {};
    h += `<div class="card"><h3>Gauge drift and reconciliation <span class="small muted">${esc(R.gauge_drift_report.report_id)} · ${reportLinks(dir, 'gauge_drift_report')}</span></h3>`;
    h += `<table><thead><tr><th>Station</th><th>Classification</th><th>Bias (psi)</th><th>Slope (psi/yr)</th><th>Noise σ</th><th>n</th><th>Span (yr)</th></tr></thead><tbody>`;
    for (const s of ev.stations) h += `<tr><td class="mono">${esc(s.channel)}</td><td>${statusPill(classKind(s.classification), s.classification)}</td><td>${fmt(s.bias_psi)}</td><td>${fmt(s.slope_psi_yr)}</td><td>${fmt(s.noise_sigma_psi)}</td><td>${s.n}</td><td>${fmt(s.span_years, 3)}</td></tr>`;
    h += `</tbody></table><h3>Data quality</h3><table><thead><tr><th>Tag</th><th>GOOD %</th><th>Flags</th><th>First</th><th>Last</th></tr></thead><tbody>`;
    for (const [t, q] of Object.entries(dq)) h += `<tr><td class="mono">${esc(t)}</td><td>${statusPill(q.pct_good >= 95 ? 'good' : (q.pct_good >= 85 ? 'warn' : 'serious'), fmt(q.pct_good, 1) + ' %')}</td><td class="small">${Object.entries(q.counts).filter(([k, v]) => v && k !== 'GOOD').map(([k, v]) => k + ' ' + v).join(', ') || 'none'}</td><td class="small">${esc(q.first_utc)}</td><td class="small">${esc(q.last_utc)}</td></tr>`;
    h += `</tbody></table></div>`; }
  if (d.monitor && d.monitor.state) { h += `<div class="card"><h3>Drift monitor</h3><p class="small">Evaluations ${(d.monitor.evaluations || []).length} · change-log entries ${(d.monitor.change_log || []).length} · open proposals: ${(d.monitor.change_log || []).filter(e => e.status === 'PROPOSED').length} (<a href="#/approvals">decide</a>)</p><details><summary>State</summary><pre>${esc(JSON.stringify(d.monitor.state, null, 1))}</pre></details></div>`; }
  // charts
  h += `<div class="card"><h3>Trends</h3><div class="row"><label>Channel<select id="chan"></select></label><span class="small muted" id="chanNote"></span></div><div id="chart"></div></div>`;
  // well tests
  if (R.well_test_validation) { const det = R.well_test_validation.detection;
    h += `<div class="card"><h3>Well tests <span class="small muted">${reportLinks(dir, 'well_test_validation')}</span></h3><p class="small">${det.n_accepted} accepted · ${det.n_rejected} rejected · criteria ${esc(det.criteria && det.criteria._sha256)}</p><table><thead><tr><th>Test</th><th>Window</th><th>n</th><th>Approval</th></tr></thead><tbody>`;
    const appr = d.approvals; for (const t of det.tests) { const decs = appr.filter(a => a.test_id === t.test_id); h += `<tr><td>${esc(t.test_id)}</td><td class="small">${esc(t.start_utc)} → ${esc(t.end_utc)}</td><td>${t.n}</td><td>${decs.length ? decs.map(a => statusPill(classKind(a.decision), `L${a.level} ${a.decision} by ${a.approver}`)).join(' ') : statusPill('warn', 'pending')}</td></tr>`; }
    h += `</tbody></table></div>`; }
  // alarms
  if (R.alarm_event_report) { const k = R.alarm_event_report.kpis, act = R.alarm_event_report.active || [];
    h += `<div class="card"><h3>Alarms <span class="small muted">${reportLinks(dir, 'alarm_event_report')}</span></h3><p class="small">${k.n_activations} activations in ${fmt(k.window_hours, 1)} h · ${fmt(k.avg_per_10min_per_position, 2)} per 10 min per position (target ≤ 1) · flood ${fmt(k.pct_time_in_flood, 1)} % of the time</p><table><thead><tr><th>Alarm</th><th>State</th><th>Priority</th><th>Since</th><th>Last value</th><th></th></tr></thead><tbody>`;
    for (const a of act) h += `<tr><td class="mono">${esc(a.alarm_id)}</td><td>${statusPill(a.state === 'ACTIVE_UNACKED' ? 'serious' : 'warn', a.state)}</td><td>${esc(a.priority)}</td><td class="small">${esc(a.active_since_utc)}</td><td>${fmt(a.last_value)}</td><td>${can('operator') && a.state === 'ACTIVE_UNACKED' ? `<button class="secondary" data-ack="${esc(a.alarm_id)}" type="button">Acknowledge</button>` : ''}</td></tr>`;
    h += `</tbody></table></div>`; }
  if (R.data_resilience_report) h += `<div class="card"><h3>Data resilience <span class="small muted">${reportLinks(dir, 'data_resilience_report')}</span></h3></div>`;
  h += `<div class="card"><h3>Files</h3><p class="small mono">${d.files.reports.map(f => `<a href="/reports/${esc(dir)}/${esc(f)}" target="_blank" rel="noopener">${esc(f)}</a>`).join(' · ') || 'no reports yet'}</p>${d.files.live.length ? `<p class="small">Live recordings: ${d.files.live.length} files</p>` : ''}</div>`;
  $('#main').innerHTML = h;
  const run = async (args, label) => { try { const j = await post('/api/jobs', {args, label}); toast(label + ': job ' + j.id, 'ok'); watch(j.id, () => route()); } catch (e) { toast(e.message, 'err'); } };
  const wsPath = (await get('/api/overview')).workspace.path;
  const b1 = $('#runDrift'); if (b1) b1.onclick = () => run(['workspace', '--path', wsPath, '--action', 'refresh', '--actor', me.name], 'drift report (all wells)');
  const b2 = $('#runAlarms'); if (b2) b2.onclick = () => run(['workspace', '--path', wsPath, '--action', 'refresh', '--actor', me.name], 'alarms (all wells)');
  const ts = $('#tapStart'); if (ts) ts.onclick = async () => { try { const j = await post(`/api/wells/${id}/tap/start`, {seconds: +$('#tapSec').value}); toast('Tap started: job ' + j.id, 'ok'); watch(j.id, () => route()); } catch (e) { toast(e.message, 'err'); } };
  const tp = $('#tapStop'); if (tp) tp.onclick = async () => { try { await post(`/api/wells/${id}/tap/stop`); toast('Tap stopped', 'ok'); route(); } catch (e) { toast(e.message, 'err'); } };
  document.querySelectorAll('[data-ack]').forEach(b => b.onclick = async () => { b.disabled = true; try { const j = await post('/api/alarms/ack', {well_id: id, alarm_id: b.dataset.ack}); toast(`Acknowledged ${b.dataset.ack} (${j.status})`, j.status === 'DONE' ? 'ok' : 'err'); route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  try { const s = await get(`/api/wells/${id}/series`); const sel = $('#chan'); sel.innerHTML = Object.keys(s.channels).map(c => `<option>${esc(c)}</option>`).join(''); $('#chanNote').textContent = `${s.n_source} source samples, every ${s.stride}${s.stride > 1 ? 'th' : ''} shown · index ${s.index_kind}${s.start_time ? ' from ' + s.start_time : ''}`;
    const draw = () => { const c = s.channels[sel.value]; $('#chart').innerHTML = lineChart(s.index, c.values, c.quality, c.unit, sel.value); }; sel.onchange = draw; draw(); }
  catch (e) { $('#chart').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
};

VIEWS.live = async () => {
  const {patches, protocols} = await get('/api/patches'); const {wells} = await get('/api/wells');
  let h = `<h2>Patch panel</h2><p class="small muted">A patch is a supervised connection from a source on the site network to a well: the drill floor over WITS0 (mud logger, EDR), a WITSML store, an OPC UA server, an MQTT broker or a Modbus device. The service keeps every enabled patch up, reconnects with backoff when the source drops, and writes every record to the well's live files. No credential is ever in a map; only the names of the environment variables that hold them.</p>`;
  h += `<table><thead><tr><th>Patch</th><th>Protocol</th><th>Well</th><th>State</th><th>Since</th><th>Last sample</th><th>Samples/min</th><th>Latency p50 / p95</th><th>Reconnects</th><th></th></tr></thead><tbody>`;
  const kind = st => ({CONNECTED: 'good', CONNECTING: 'warn', DEGRADED: 'warn', DOWN: 'serious', STOPPED: 'neutral'}[st] || 'neutral');
  for (const p of patches) h += `<tr><td><a href="#/live/${esc(p.name)}">${esc(p.name)}</a>${p.patch.enabled ? '' : ' <span class="small muted">(disabled)</span>'}</td><td class="mono">${esc(p.protocol)}</td><td><a href="#/wells/${esc(p.well_id)}">${esc(p.well_id)}</a></td><td>${statusPill(kind(p.status), p.status)}${p.last_error && p.status !== 'CONNECTED' ? `<div class="small muted">${esc(p.last_error).slice(0, 90)}</div>` : ''}</td><td class="small">${esc(p.since_utc)}</td><td class="small">${esc(p.last_sample_utc) || '—'}</td><td>${p.samples_last_min}</td><td>${fmt(p.latency_p50_s, 3)} / ${fmt(p.latency_p95_s, 3)} s</td><td>${p.reconnects}</td><td>${can('operator') ? (p.status === 'STOPPED' ? `<button data-pa="start" data-n="${esc(p.name)}" type="button">Start</button>` : `<button class="secondary" data-pa="stop" data-n="${esc(p.name)}" type="button">Stop</button>`) : ''}</td></tr>`;
  if (!patches.length) h += `<tr><td colspan="10" class="muted">no patches yet</td></tr>`;
  h += `</tbody></table>`;
  if (can('operator')) {
    h += `<div class="card"><h3>Add a patch</h3><div class="row"><label>Name<input id="pName" placeholder="floor"></label><label>Protocol<select id="pProto">${protocols.map(x => `<option>${x}</option>`).join('')}</select></label><label>Well<select id="pWell">${wells.map(w => `<option value="${esc(w.id)}">${esc(w.display)}</option>`).join('')}</select></label><label>Priority<input id="pPrio" type="number" value="1" min="1" style="width:70px"></label><label>Stale after (s)<input id="pStale" type="number" value="120" min="1" style="width:90px"></label><label><input type="checkbox" id="pAuto" checked> auto-restart</label><button class="secondary" id="pExample" type="button">Load the example map</button><button id="pAdd" type="button">Add and start</button></div><label>Map (JSON)<textarea id="pCfg" spellcheck="false"></textarea></label>
      <p class="small muted">To rehearse without a rig: in a command window run <span class="mono">gea wits0-sim --port 5001</span> (a WITS0 sender) and add a WITS0 patch with transport tcp, host 127.0.0.1, port 5001.</p></div>`;
  } else h += need('operator');
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await post(`/api/patches/${b.dataset.n}/${b.dataset.pa}`); toast(`${b.dataset.n}: ${r.status || 'ok'}`, 'ok'); setTimeout(route, 800); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  const ex = $('#pExample'); if (ex) { ex.onclick = async () => { try { const d = await get('/api/config/defaults/' + $('#pProto').value); $('#pCfg').value = JSON.stringify(d.content, null, 1); } catch (e) { toast(e.message, 'err'); } };
    $('#pAdd').onclick = async () => { let cfg; try { cfg = JSON.parse($('#pCfg').value); } catch (e) { return toast('The map is not valid JSON', 'err'); } try { const p = await post('/api/patches/add', {name: $('#pName').value, protocol: $('#pProto').value, well_id: $('#pWell').value, config: cfg, priority: +$('#pPrio').value, stale_after_s: +$('#pStale').value, auto_restart: $('#pAuto').checked}); await post(`/api/patches/${p.name}/start`); toast('Patch ' + p.name + ' added and started', 'ok'); location.hash = '#/live/' + p.name; } catch (e) { toast(e.message, 'err'); } }; }
};
VIEWS.patch = async (name) => {
  const {patches} = await get('/api/patches'); const p = patches.find(x => x.name === name); if (!p) { $('#main').innerHTML = '<h2>No such patch</h2>'; return; }
  const kind = st => ({CONNECTED: 'good', CONNECTING: 'warn', DEGRADED: 'warn', DOWN: 'serious', STOPPED: 'neutral'}[st] || 'neutral');
  let h = `<h2>Patch ${esc(p.name)} <span class="small muted">${esc(p.protocol)} → <a href="#/wells/${esc(p.well_id)}">${esc(p.well_id)}</a></span></h2>`;
  h += `<dl class="kv card"><dt>State</dt><dd>${statusPill(kind(p.status), p.status)} since ${esc(p.since_utc)}${p.last_error ? ` · last error: <span class="mono small">${esc(p.last_error)}</span>` : ''}</dd><dt>Samples</dt><dd>${p.samples_total} total · ${p.samples_last_min} in the last minute · last at ${esc(p.last_sample_utc) || '—'}</dd><dt>Latency</dt><dd>p50 ${fmt(p.latency_p50_s, 3)} s · p95 ${fmt(p.latency_p95_s, 3)} s (source timestamp → arrival)</dd><dt>Reconnects</dt><dd>${p.reconnects}</dd><dt>Settings</dt><dd>priority ${p.patch.priority} · stale after ${p.patch.stale_after_s} s · ${p.patch.auto_restart ? 'auto-restart' : 'no auto-restart'} · ${p.patch.enabled ? 'enabled' : 'disabled'} · map sha256 ${esc((p.patch.sha256 || '').slice(0, 16))}</dd></dl>`;
  if (can('operator')) h += `<div class="row card">${p.status === 'STOPPED' ? `<button data-pa="start" type="button">Start</button>` : `<button class="secondary" data-pa="stop" type="button">Stop</button>`}<button class="secondary" data-pa="update" data-f="enabled" data-v="${p.patch.enabled ? 'false' : 'true'}" type="button">${p.patch.enabled ? 'Disable' : 'Enable'}</button><button class="secondary" data-pa="update" data-f="auto_restart" data-v="${p.patch.auto_restart ? 'false' : 'true'}" type="button">${p.patch.auto_restart ? 'Turn auto-restart off' : 'Turn auto-restart on'}</button>${can('admin') ? `<button class="secondary danger" data-pa="remove" type="button">Remove</button>` : ''}</div>`;
  const tags = Object.entries(p.tags || {});
  h += `<div class="card"><h3>Live values (${tags.length} tags)</h3><table><thead><tr><th>Tag</th><th>Value</th><th>Unit</th><th>Quality</th><th>Source time</th></tr></thead><tbody>${tags.map(([t, v]) => `<tr><td class="mono">${esc(t)}</td><td>${fmt(v.value, 3)}</td><td>${esc(v.unit)}</td><td>${statusPill(v.quality === 'GOOD' ? 'good' : (v.quality === 'GAP' ? 'serious' : 'warn'), v.quality)}</td><td class="small">${esc(v.timestamp_utc)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">nothing received yet</td></tr>'}</tbody></table></div>`;
  h += `<div class="card"><h3>Map</h3>${can('operator') ? `<label>JSON<textarea id="pmCfg" spellcheck="false"></textarea></label><button id="pmSave" type="button">Validate and save (versioned; takes effect on the next start)</button>` : ''}</div>`;
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => { const a = b.dataset.pa; if (a === 'remove' && !confirm('Remove patch ' + name + '?')) return; b.disabled = true; try { const body = a === 'update' ? {[b.dataset.f]: b.dataset.v === 'true'} : {}; await post(`/api/patches/${name}/${a}`, body); toast(`${name}: ${a}`, 'ok'); if (a === 'remove') location.hash = '#/live'; else setTimeout(route, 800); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  const ta = $('#pmCfg'); if (ta) { try { const c = await get(`/api/patches/${name}/config`); ta.value = JSON.stringify(c.config, null, 1); } catch (e) {} $('#pmSave').onclick = async () => { let cfg; try { cfg = JSON.parse(ta.value); } catch (e) { return toast('not valid JSON', 'err'); } try { const m = await post(`/api/patches/${name}/config`, {config: cfg}); toast('Saved as version ' + m.version, 'ok'); } catch (e) { toast(e.message, 'err'); } }; }
  if (p.status !== 'STOPPED') setTimeout(() => { if (location.hash === '#/live/' + name) route(); }, 3000);
};

VIEWS.alarms = async () => {
  const {wells} = await get('/api/wells'); let rows = [];
  for (const w of wells) { try { const d = await get('/api/wells/' + w.id); const r = d.reports.alarm_event_report; if (r) for (const a of (r.active || [])) rows.push({well: w, a}); } catch (e) {} }
  rows.sort((x, y) => (x.a.priority > y.a.priority ? 1 : -1) || (x.a.state === 'ACTIVE_UNACKED' ? -1 : 1));
  let h = `<h2>Alarm wall</h2><p class="small muted">${rows.length} active · ${rows.filter(r => r.a.state === 'ACTIVE_UNACKED').length} unacknowledged. Acknowledging re-processes the well's stream with your name on the event.</p>`;
  h += `<table><thead><tr><th>Priority</th><th>Well</th><th>Alarm</th><th>State</th><th>Since</th><th>Last value</th><th></th></tr></thead><tbody>`;
  for (const {well, a} of rows) h += `<tr><td>${statusPill(classKind(a.priority), a.priority)}</td><td><a href="#/wells/${esc(well.id)}">${esc(well.display)}</a></td><td class="mono">${esc(a.alarm_id)}</td><td>${statusPill(a.state === 'ACTIVE_UNACKED' ? 'serious' : 'warn', a.state)}</td><td class="small">${esc(a.active_since_utc)}</td><td>${fmt(a.last_value)}</td><td>${can('operator') && a.state === 'ACTIVE_UNACKED' ? `<button class="secondary" data-w="${esc(well.id)}" data-a="${esc(a.alarm_id)}" type="button">Acknowledge</button>` : ''}</td></tr>`;
  h += `</tbody></table>`;
  h += `<div class="card"><h3>Alarm definitions</h3><p class="small muted">Setpoints, deadbands, on-delays and priorities, versioned in the configuration store as <span class="mono">alarm_definitions</span>.</p>${can('operator') ? `<div class="row"><button class="secondary" id="defLoad" type="button">Load current</button><button class="secondary" id="defDefault" type="button">Derive defaults from the first historian well</button><button id="defSave" type="button">Validate and commit</button></div><label>JSON<textarea id="defs" spellcheck="false"></textarea></label><label>Note<input id="defNote"></label>` : need('operator')}</div>`;
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { b.disabled = true; try { const j = await post('/api/alarms/ack', {well_id: b.dataset.w, alarm_id: b.dataset.a}); toast(`Acknowledged (${j.status})`, j.status === 'DONE' ? 'ok' : 'err'); route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  const L = $('#defLoad'); if (L) { L.onclick = async () => { try { const c = await get('/api/config/alarm_definitions'); $('#defs').value = JSON.stringify(c.current, null, 1); } catch (e) { toast('no committed definitions yet: ' + e.message, 'err'); } };
    $('#defDefault').onclick = async () => { try { const d = await get('/api/config/defaults/alarm_definitions'); $('#defs').value = JSON.stringify(d.content, null, 1); } catch (e) { toast(e.message, 'err'); } };
    $('#defSave').onclick = async () => { let c; try { c = JSON.parse($('#defs').value); } catch (e) { return toast('not valid JSON', 'err'); } try { const m = await post('/api/config/commit', {name: 'alarm_definitions', content: c, note: $('#defNote').value}); toast('Committed version ' + m.version, 'ok'); } catch (e) { toast(e.message, 'err'); } }; }
};

VIEWS.approvals = async () => {
  const q = await get('/api/approvals');
  let h = `<h2>Approvals</h2><p class="small muted">Everything waiting on a person. A decision runs the program's own approval command with your name and note; the record is appended, never edited.</p>`;
  h += `<div class="card"><h3>Well tests (${q.well_tests.length})</h3>`;
  if (!q.well_tests.length) h += `<p class="muted">Nothing pending.</p>`;
  for (const t of q.well_tests) { const lv = (t.approval.match(/PENDING_LEVEL_(\d+)/) || [0, 1])[1]; h += `<div class="row" style="border-bottom:1px solid var(--grid);padding:8px 0"><div class="apr"><b>${esc(t.test_id)}</b> on <a href="#/wells/${esc(t.well_id)}">${esc(t.well_id)}</a><br><span class="small">${esc(t.start_utc)} → ${esc(t.end_utc)} · ${t.n} samples · ${statusPill('warn', t.approval)}</span>${t.virtual_rates ? `<br><span class="small mono">${esc(JSON.stringify(t.virtual_rates)).slice(0, 120)}</span>` : ''}</div>${can('approver') ? `<label>Level<input type="number" value="${lv}" min="1" style="width:70px" id="lv-${esc(t.test_id)}"></label><label>Decision<select id="dc-${esc(t.test_id)}"><option>APPROVED</option><option>REJECTED</option><option>CORRECTED</option></select></label><label>Note<input id="nt-${esc(t.test_id)}"></label><button data-wt="${esc(t.test_id)}" data-w="${esc(t.well_id)}" type="button">Record decision</button>` : ''}</div>`; }
  h += `</div><div class="card"><h3>Re-fit and fallback proposals (${q.refits.length})</h3>`;
  if (!q.refits.length) h += `<p class="muted">Nothing proposed.</p>`;
  for (const r of q.refits) h += `<div class="row" style="border-bottom:1px solid var(--grid);padding:8px 0"><div class="apr"><b>${esc(r.entry_id)}</b> · ${esc(r.type)} on <a href="#/wells/${esc(r.well_id)}">${esc(r.well_id)}</a><br><span class="small">${esc(r.station)} · ${statusPill(classKind(r.classification), r.classification)} · bias ${fmt(r.bias_psi)} psi · slope ${fmt(r.slope_psi_yr)} psi/yr<br>${esc(r.detail)}</span></div>${can('approver') ? `<label>Decision<select id="rd-${esc(r.entry_id)}"><option>APPLIED</option><option>REJECTED</option></select></label><label>Note<input id="rn-${esc(r.entry_id)}"></label><button data-rf="${esc(r.entry_id)}" data-w="${esc(r.well_id)}" type="button">Record decision</button>` : ''}</div>`;
  h += `</div>` + (can('approver') ? '' : need('approver'));
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-wt]').forEach(b => b.onclick = async () => { b.disabled = true; const id = b.dataset.wt; try { const j = await post('/api/approvals/well-test', {well_id: b.dataset.w, test_id: id, level: +$('#lv-' + id).value, decision: $('#dc-' + id).value, note: $('#nt-' + id).value}); toast(`${id}: ${j.status}`, j.status === 'DONE' ? 'ok' : 'err'); if (j.status !== 'DONE') location.hash = '#/jobs/' + j.id; else route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  document.querySelectorAll('[data-rf]').forEach(b => b.onclick = async () => { b.disabled = true; const id = b.dataset.rf; try { const j = await post('/api/approvals/refit', {well_id: b.dataset.w, entry: id, decision: $('#rd-' + id).value, note: $('#rn-' + id).value}); toast(`${id}: ${j.status}`, j.status === 'DONE' ? 'ok' : 'err'); if (j.status !== 'DONE') location.hash = '#/jobs/' + j.id; else route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
};

VIEWS.config = async (name) => {
  const {configs} = await get('/api/config');
  let h = `<h2>Configuration</h2><p class="small muted">Every JSON the program reads, under version control: commit with a note, see the history and the diff, roll back. <span class="mono">criteria</span> (well tests) and <span class="mono">alarm_definitions</span> are validated the way the commands load them.</p>`;
  h += `<table><thead><tr><th>Name</th><th>Versions</th><th>Last change</th><th>By</th><th>Rollbacks</th></tr></thead><tbody>${configs.map(c => `<tr><td><a href="#/config/${esc(c.name)}">${esc(c.name)}</a></td><td>${c.versions}</td><td class="small">${esc(c.last_change_utc)}</td><td>${esc(c.last_author)}</td><td>${c.rollbacks}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">nothing committed yet</td></tr>'}</tbody></table>`;
  h += `<div class="card"><h3>${name ? 'Edit ' + esc(name) : 'New or edit'}</h3>${can('operator') ? `<div class="row"><label>Name<input id="cfgName" value="${esc(name || '')}" list="cfgNames"><datalist id="cfgNames"><option>criteria</option><option>alarm_definitions</option></datalist></label><button class="secondary" id="cfgLoad" type="button">Load current</button><button class="secondary" id="cfgDefault" type="button">Start from the defaults</button><button id="cfgCommit" type="button">Validate and commit</button></div><label>JSON<textarea id="cfgBody" spellcheck="false"></textarea></label><label>Note<input id="cfgNote"></label>` : need('operator')}</div>`;
  if (name) { try { const d = await get('/api/config/' + name); h += `<div class="card"><h3>History of ${esc(name)}</h3><table><thead><tr><th>Version</th><th>When</th><th>Author</th><th>Note</th><th>Changed keys</th><th></th></tr></thead><tbody>${d.history.slice().reverse().map(e => `<tr><td>${e.version}${e.rollback_of ? ' (rollback of ' + e.rollback_of + ')' : ''}</td><td class="small">${esc(e.timestamp_utc)}</td><td>${esc(e.author)}</td><td>${esc(e.note)}</td><td class="small mono">${esc((e.diff && (e.diff.changed || e.diff.keys_changed) || []).join(', '))}</td><td>${can('admin') && e.version !== d.history[d.history.length - 1].version ? `<button class="secondary" data-rb="${e.version}" type="button">Roll back to this</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`; } catch (e) {} }
  $('#main').innerHTML = h;
  if (!can('operator')) return;
  if (name) { try { const d = await get('/api/config/' + name); $('#cfgBody').value = JSON.stringify(d.current, null, 1); } catch (e) {} }
  $('#cfgLoad').onclick = async () => { try { const d = await get('/api/config/' + $('#cfgName').value); $('#cfgBody').value = JSON.stringify(d.current, null, 1); } catch (e) { toast(e.message, 'err'); } };
  $('#cfgDefault').onclick = async () => { try { const d = await get('/api/config/defaults/' + $('#cfgName').value); $('#cfgBody').value = JSON.stringify(d.content, null, 1); } catch (e) { toast(e.message, 'err'); } };
  $('#cfgCommit').onclick = async () => { let c; try { c = JSON.parse($('#cfgBody').value); } catch (e) { return toast('not valid JSON', 'err'); } try { const m = await post('/api/config/commit', {name: $('#cfgName').value, content: c, note: $('#cfgNote').value}); toast('Committed version ' + m.version, 'ok'); location.hash = '#/config/' + $('#cfgName').value; route(); } catch (e) { toast(e.message, 'err'); } };
  document.querySelectorAll('[data-rb]').forEach(b => b.onclick = async () => { if (!confirm('Roll back ' + name + ' to version ' + b.dataset.rb + '?')) return; try { const m = await post('/api/config/rollback', {name, version: +b.dataset.rb, note: 'rollback from the dashboard'}); toast('Rolled back as version ' + m.version, 'ok'); route(); } catch (e) { toast(e.message, 'err'); } });
};

VIEWS.verify = async () => {
  const {jobs} = await get('/api/jobs?limit=200'); const last = k => jobs.find(j => j.kind === k);
  let h = `<h2>Verification</h2><p class="small muted">The same gate the program ships with, run here and kept as a job with its log. A client's own acceptance is reproducible from this page without a terminal.</p>`;
  const rows = [['accept', 'Acceptance suite (172 checks)', last('accept')], ['fat-sat', 'FAT / SAT protocol', last('fat-sat')], ['sbom', 'Software bill of materials', last('sbom')]];
  h += `<table><thead><tr><th>Check</th><th>Last run</th><th>Result</th><th></th></tr></thead><tbody>`;
  for (const [k, l, j] of rows) h += `<tr><td>${esc(l)}</td><td class="small">${j ? esc(j.finished_utc || j.started_utc || j.submitted_utc) + ' by ' + esc(j.actor) : '—'}</td><td>${j ? statusPill(classKind(j.status), j.status) : statusPill('neutral', 'not run')}</td><td>${j ? `<a href="#/jobs/${esc(j.id)}">log</a>` : ''}</td></tr>`;
  h += `</tbody></table>`;
  if (can('operator')) h += `<div class="row card"><button data-v="accept" type="button">Run the acceptance suite</button><button class="secondary" data-v="fat" type="button">FAT</button><button class="secondary" data-v="sat" type="button">SAT</button><button class="secondary" data-v="sbom" type="button">SBOM</button><button class="secondary" data-v="standalone" type="button">Standalone check</button></div><div id="vout"></div>`; else h += need('operator');
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = async () => { b.disabled = true; try { const j = await post('/api/verify', {what: b.dataset.v}); if (j.output !== undefined) $('#vout').innerHTML = `<pre>${esc(j.output)}</pre>`; else { toast('Started: job ' + j.id, 'ok'); watch(j.id, () => route()); } } catch (e) { toast(e.message, 'err'); } b.disabled = false; });
};

VIEWS.survey = async () => {

VIEWS.jobs = async (id) => {
  if (id) { const j = await get('/api/jobs/' + id); const l = await get('/api/jobs/' + id + '/log?tail=2000');
    $('#main').innerHTML = `<h2>Job ${esc(j.id)}</h2><dl class="kv card"><dt>Label</dt><dd>${esc(j.label)}</dd><dt>Command</dt><dd class="mono small">gea ${esc(j.args.join(' '))}</dd><dt>By</dt><dd>${esc(j.actor)}</dd><dt>Status</dt><dd>${statusPill(classKind(j.status), j.status)} ${j.returncode !== null ? '(exit ' + j.returncode + ')' : ''}</dd><dt>Submitted</dt><dd>${esc(j.submitted_utc)}</dd><dt>Started</dt><dd>${esc(j.started_utc)}</dd><dt>Finished</dt><dd>${esc(j.finished_utc)}</dd></dl>${can('operator') && (j.status === 'RUNNING' || j.status === 'QUEUED') ? `<button class="danger" id="cancel" type="button">Cancel</button>` : ''}<h3>Log</h3><pre>${esc(l.log) || '(empty)'}</pre><p><a href="#/jobs">All jobs</a></p>`;
    const c = $('#cancel'); if (c) c.onclick = async () => { try { await post('/api/jobs/' + id + '/cancel'); toast('Cancelled', 'ok'); route(); } catch (e) { toast(e.message, 'err'); } };
    if (j.status === 'RUNNING' || j.status === 'QUEUED') setTimeout(() => { if (location.hash === '#/jobs/' + id) route(); }, 2500);
    return; }
  const {jobs} = await get('/api/jobs?limit=100');
  $('#main').innerHTML = `<h2>Jobs</h2><p class="small muted">Every action the page takes is a job: the program's own command, its log, who asked for it and when.</p><table><thead><tr><th>Submitted</th><th>Label</th><th>Command</th><th>By</th><th>Status</th></tr></thead><tbody>${jobs.map(j => `<tr><td class="small">${esc(j.submitted_utc)}</td><td><a href="#/jobs/${esc(j.id)}">${esc(j.label)}</a></td><td class="mono small">${esc(j.kind)}</td><td>${esc(j.actor)}</td><td>${statusPill(classKind(j.status), j.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">no jobs yet</td></tr>'}</tbody></table>`;
};

  const {users} = await get('/api/users'); const {entries} = await get('/api/schedule'); const audit = (await get('/api/audit?limit=100')).entries.reverse();

    <h3>Add a scheduled job</h3><div class="row"><label>Name<input id="sName" placeholder="nightly drift"></label><label>Preset<select id="sPreset"><option value="refresh">refresh every report</option><option value="accept">acceptance suite</option><option value="sbom">SBOM</option></select></label><label>Daily at (UTC)<input id="sDaily" placeholder="02:00"></label><label>or every (s)<input id="sEvery" type="number"></label><label>Day of month (optional)<input id="sDay" type="number" min="1" max="28"></label><button id="sAdd" type="button">Add</button></div></div>`;

// ---------- job watching ----------------------------------------------------------------
const watching = {};
function watch(id, done) { if (watching[id]) return; watching[id] = true; const tick = async () => { try { const j = await get('/api/jobs/' + id); if (j.status === 'QUEUED' || j.status === 'RUNNING') return setTimeout(tick, 2000); delete watching[id]; toast(`${j.label}: ${j.status}`, j.status === 'DONE' ? 'ok' : 'err'); if (done) done(j); } catch (e) { delete watching[id]; } }; setTimeout(tick, 1500); }

// ---------- auth screens ------------------------------------------------------------------
function authScreen(first) {
  $('#main').innerHTML = `<div class="auth card"><h2>${first ? 'First administrator' : 'Sign in'}</h2><p class="small muted">${first ? 'This workspace has no accounts yet. Create the administrator; add everyone else under Administration.' : 'Workspace: ' + esc(workspaceName)}</p><form id="authForm"><label>Name<input id="aName" autocomplete="username" required></label><label>Password<input id="aPw" type="password" autocomplete="${first ? 'new-password' : 'current-password'}" required minlength="${first ? 8 : 1}"></label><p><button type="submit">${first ? 'Create and sign in' : 'Sign in'}</button></p></form></div>`;
  $('#authForm').onsubmit = async (ev) => { ev.preventDefault(); try { if (first) await post('/api/setup', {name: $('#aName').value, password: $('#aPw').value}); const r = await post('/api/login', {name: $('#aName').value, password: $('#aPw').value}); me = r.user; await boot(); } catch (e) { toast(e.message, 'err'); } };
  $('#aName').focus();
}

// ---------- routing ---------------------------------------------------------------------
const NAV = [['#/', 'Home'], ['#/wells', 'Wells'], ['#/live', 'Patch panel'], ['#/alarms', 'Alarms'], ['#/approvals', 'Approvals'], ['#/config', 'Configuration'], ['#/reports', 'Reports'], ['#/verify', 'Verification'], ['#/survey', 'Survey'], ['#/jobs', 'Jobs'], ['#/admin', 'Administration']];
function renderNav() { const cur = location.hash || '#/'; $('#nav').innerHTML = NAV.map(([h, l]) => `<a href="${h}" ${(h === '#/' ? cur === '#/' || cur === '' : cur.startsWith(h)) ? 'aria-current="page"' : ''}>${l}</a>`).join(''); }
let routeChain = Promise.resolve();
function route() { routeChain = routeChain.then(_route, _route); return routeChain; }   // one view at a time, in order
async function _route() {
  if (!me) return;
  renderNav();
  const parts = (location.hash || '#/').slice(2).split('/').filter(Boolean);
  const view = parts[0] || 'home', arg = parts.slice(1).join('/');
  try {
    if (view === 'wells' && arg) await VIEWS.well(decodeURIComponent(arg));
    else if (view === 'live' && arg) await VIEWS.patch(decodeURIComponent(arg));
    else if (VIEWS[view]) await VIEWS[view](arg ? decodeURIComponent(arg) : undefined);
    else $('#main').innerHTML = `<h2>Not found</h2>`;
  } catch (e) { $('#main').innerHTML = `<div class="card"><h2>Could not load this page</h2><p>${esc(e.message)}</p></div>`; if (e.status === 401) { me = null; boot(); } }
  $('#main').focus({preventScroll: true});
}
async function boot() {
  const s = await get('/api/session'); workspaceName = s.workspace; $('#siteName').textContent = workspaceName; me = s.user;
  if (!me) { $('#whoami').textContent = ''; $('#logoutBtn').hidden = true; $('#nav').innerHTML = ''; return authScreen(s.users === 0); }
  $('#whoami').textContent = `${me.name} · ${me.role}`; $('#logoutBtn').hidden = false;
  await route();
}
$('#logoutBtn').onclick = async () => { await post('/api/logout'); me = null; boot(); };
window.addEventListener('hashchange', route);
// theme: follows the system unless the viewer chooses; the choice is a per-browser convenience
(function () { let t = null; try { t = localStorage.getItem('gea-theme'); } catch (e) {} const apply = () => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#themeBtn').textContent = dark ? 'Light theme' : 'Dark theme'; $('#themeBtn').setAttribute('aria-pressed', String(dark)); }; $('#themeBtn').onclick = () => { const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; t = dark ? 'light' : 'dark'; try { localStorage.setItem('gea-theme', t); } catch (e) {} apply(); }; apply(); })();
boot().catch(e => { $('#main').innerHTML = `<div class="card"><h2>The service did not answer</h2><p>${esc(e.message)}</p></div>`; });
</script>
</body>
