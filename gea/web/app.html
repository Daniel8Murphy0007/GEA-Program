<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEA-Program</title>
<style>
:root{color-scheme:light;--page:#f6f5f0;--surface:#fff;--ink:#141412;--ink2:#3d3c37;--muted:#77756e;--grid:#e3e1d8;--ring:rgba(0,0,0,.08);--accent:#1f5fb8;--accent-ink:#fff;--good:#1d7a4a;--warn:#a86a00;--serious:#b3261e;--track:#dfe8f7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);--accent:#3987e5;--good:#5ec48f;--warn:#e2a93b;--serious:#ee6a62;--track:#1f2f44;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
:root[data-theme=dark]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);--accent:#3987e5;--good:#5ec48f;--warn:#e2a93b;--serious:#ee6a62;--track:#1f2f44;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}
*{box-sizing:border-box}html{font-size:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--grid)}
header h1{font-size:18px;margin:0 8px 0 0}header .site{color:var(--muted)}header .spacer{flex:1}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--grid)}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink2)}nav a[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:8px 0 12px}h3{font-size:16px;margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px var(--ring)}
.tile .v{font-size:26px;font-weight:600;line-height:1.2}.tile .l{color:var(--muted);font-size:13px}.tile .n{font-size:13px;color:var(--ink2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px var(--ring)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}th{color:var(--muted);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}.status .i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.good{color:var(--good)}.good .i{background:var(--good)}.warn{color:var(--warn)}.warn .i{background:var(--warn);border-radius:2px}.serious{color:var(--serious)}.serious .i{background:var(--serious);border-radius:0;transform:rotate(45deg)}.neutral{color:var(--muted)}
button,.btn{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:var(--surface);color:var(--accent)}button.danger{background:var(--serious);border-color:var(--serious)}button[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row>*{margin:0}
label{display:block;font-size:13px;color:var(--ink2)}label>input,label>select,label>textarea{display:block;margin-top:3px;font:inherit;padding:6px 8px;border:1px solid var(--grid);border-radius:6px;background:var(--surface);color:var(--ink);min-width:160px}
textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:13px}
pre{background:var(--page);border:1px solid var(--grid);border-radius:8px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12.5px;max-height:420px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}.small{font-size:13px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast{background:var(--surface);border:1px solid var(--grid);border-left:5px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 4px 14px var(--ring);max-width:420px}
.toast.err{border-left-color:var(--serious)}.toast.ok{border-left-color:var(--good)}
.auth{max-width:420px;margin:60px auto}.auth label>input{width:100%}
svg.chart{width:100%;height:260px;display:block}svg.chart text{font:11px var(--sans);fill:var(--ink2)}svg.chart .grid{stroke:var(--grid)}svg.chart .line{fill:none;stroke:var(--accent);stroke-width:1.6}svg.chart .q{r:2.2}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:8px;z-index:10}
details summary{cursor:pointer;color:var(--accent)}
.tl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
.tl-cat{margin:14px 0 4px;font-size:14px;color:var(--ink2)}
.tl-grid{display:flex;flex-wrap:wrap;gap:6px}
.tl-chip{position:relative;font:inherit;font-size:13px;line-height:1.3;padding:6px 11px;border:1px solid var(--grid);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.tl-chip:hover,.tl-chip:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.tl-chip .tl-fl{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600}
.tl-tip{display:none;visibility:hidden;opacity:0;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:min(340px,82vw);padding:8px 10px;background:var(--ink);color:var(--page);border-radius:6px;font-size:12.5px;font-weight:400;line-height:1.4;text-align:left;pointer-events:none;transition:opacity .12s;box-shadow:0 4px 14px var(--ring)}
.tl-tip .tl-hint{display:block;margin-top:4px;opacity:.75;font-size:11.5px}
.tl-chip:hover .tl-tip,.tl-chip:focus-visible .tl-tip{display:block;visibility:visible;opacity:1}
@media (hover:none){.tl-tip{display:none}}
dialog.tl-dlg{width:min(780px,94vw);max-height:90vh;border:1px solid var(--grid);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog.tl-dlg::backdrop{background:rgba(0,0,0,.45)}
.ck-bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin:6px 0 4px;max-width:520px}.ck-bar span{display:block;height:100%;background:var(--good);border-radius:999px}
.ck-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--grid)}.ck-item:last-child{border-bottom:0}
.ck-item .ck-mark{font-size:20px;line-height:1.2;width:1.4em;text-align:center}.ck-item.done .ck-mark{color:var(--good)}.ck-item.todo .ck-mark{color:var(--warn)}
.ck-item h4{margin:0;font-size:15px}.ck-item.next{background:linear-gradient(90deg,var(--track),transparent 70%);border-radius:8px;padding-left:6px}
.ck-lv{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--grid);color:var(--muted);margin-left:6px;vertical-align:2px}
.ck-lv.required{border-color:var(--accent);color:var(--accent)}
.ck-act{margin-top:6px}.ck-act form{margin-top:4px}.ck-act .row label>input,.ck-act .row label>select{min-width:8em}
.cp-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:6px 0}.cp-ctl .seg{display:inline-flex;border:1px solid var(--grid);border-radius:7px;overflow:hidden}.cp-ctl .seg button{border:0;border-radius:0;background:var(--surface);color:var(--ink2);padding:6px 12px}.cp-ctl .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.cp-ctl .tb button{padding:6px 10px;min-width:2.4em}
.mp-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}@media (max-width:900px){.mp-wrap{grid-template-columns:1fr}}
.mp-map{position:relative;border:1px solid var(--grid);border-radius:10px;overflow:hidden;background:var(--surface);touch-action:none;user-select:none}.mp-map:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mp-map svg{display:block;width:100%}.mp-map text{font:11px var(--sans);fill:var(--ink2)}.mp-map .wl{font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.mp-map .st{fill:none;stroke:var(--ink2);stroke-width:1.3}.mp-map .co{fill:none;stroke:var(--grid);stroke-width:.8}.mp-map .cl{fill:var(--muted);font-size:10.5px}
.mp-map .ft{fill:none;stroke:var(--ink);stroke-width:1.3}.mp-map .fo{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:6 3}.mp-map .ot{fill:none;stroke:var(--muted);stroke-width:1}
.mp-map .ct{fill:none;stroke:var(--s1);stroke-width:1;opacity:.85}.mp-map .ci{fill:none;stroke:var(--s3);stroke-width:1;stroke-dasharray:4 3;opacity:.85}.mp-map .cb{fill:none;stroke:var(--s2);stroke-width:1;opacity:.85}
.mp-map .ar{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-width:1}.mp-map .pt{fill:var(--muted)}
.mp-map .sh{stroke:var(--s2);stroke-width:1.6;stroke-linecap:round}.mp-map .sh.q{stroke-width:2.4}
.mp-map .sra{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:8 4}.mp-map .ring{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.8}
.mp-map .well{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:pointer}.mp-map .well:hover,.mp-map .well:focus{stroke:var(--ink)}.mp-map .sta{fill:var(--s3);stroke:var(--surface);stroke-width:1.5}
.mp-map .here{fill:none;stroke:var(--serious);stroke-width:2}
.mp-busy svg{opacity:.6;transition:opacity .15s}
.mp-side .card{margin:0 0 12px}.mp-side label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin:3px 0}.mp-side label>input{display:inline-block;margin:0;min-width:0;width:auto;padding:0}
.mp-sw{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink);vertical-align:middle}
.mp-read{font-size:13px;min-height:1.4em;margin:4px 0}.mp-read b{font-variant-numeric:tabular-nums}
.cp-secs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.cp-secs button{flex:0 0 auto;width:auto}
.cp-stack{position:relative;touch-action:pan-y;user-select:none;border-radius:6px}.cp-stack:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cp-stack svg{width:100%;display:block}.cp-stack text{font:12px var(--sans);fill:var(--ink2)}.cp-stack .ttl{fill:var(--ink);font-weight:600}
.cp-stack .grid{stroke:var(--grid);stroke-width:1}.cp-stack .env{fill:var(--accent);opacity:.18}.cp-stack .mean{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.cp-stack .evt{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 3}.cp-stack .evl{fill:var(--warn);font-size:11px;font-weight:600}.cp-stack .con{stroke:var(--muted);stroke-width:1}
.cp-stack .cur{stroke:var(--ink);stroke-width:1;pointer-events:none}.cp-stack .brush{fill:var(--accent);opacity:.12;stroke:var(--accent);stroke-width:1;pointer-events:none}
.cp-stack .flag{fill:var(--warn)}
.cp-loading svg{opacity:.55;transition:opacity .15s}
.cp-read{min-height:2.6em;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:4px 0;font-size:13px}.cp-read .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.cp-read .k{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}.cp-read .n{color:var(--ink2)}
.pp-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:4px 0}.pp-legend .k{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.ck-chk{display:inline-flex!important;gap:6px;align-items:center;margin-right:12px}.ck-chk>input{display:inline-block!important;margin:0!important;width:auto;padding:0;min-width:0!important}
.ck-cli{font-family:var(--mono);font-size:12.5px;background:var(--page);border:1px solid var(--grid);border-radius:6px;padding:4px 8px;display:inline-block;margin-top:4px;user-select:all;word-break:break-all}
.tl-dlg .tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--grid)}
.tl-dlg .tl-head h3{margin:0 0 4px}.tl-dlg .tl-body{padding:6px 18px 16px;overflow:auto;max-height:calc(90vh - 90px)}
.tl-dlg dl{margin:6px 0}.tl-dlg dt{font-weight:600;margin-top:12px;color:var(--ink2)}.tl-dlg dd{margin:3px 0 0}
.tl-dlg table{font-size:13px}.tl-dlg .tl-src{word-break:break-all}
nav a .b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--serious);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}nav a .b.w{background:var(--warn)}nav a[aria-current=page] .b{background:#fff;color:var(--accent)}
header .search{display:flex;gap:4px;align-items:center}header .search input{font:inherit;padding:6px 8px;border:1px solid var(--grid);border-radius:6px;background:var(--surface);color:var(--ink);width:200px}
.help{background:var(--surface);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:14px}.help h4{margin:0 0 4px;font-size:14px}.help p{margin:4px 0}
.helppage h2{margin-top:4px}.helppage p{max-width:80ch}.helppage code{font-family:var(--mono);font-size:13px;background:var(--page);padding:1px 4px;border-radius:4px}
.since{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--track);border-radius:10px;padding:8px 14px;margin:8px 0;font-size:14px}.since b{font-weight:600}
.wizard ol{padding-left:20px}.wizard li{margin:6px 0}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.steps span{padding:4px 10px;border-radius:14px;background:var(--track);font-size:13px}.steps span.on{background:var(--accent);color:var(--accent-ink)}
.hit{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid)}.hit .k{min-width:120px;color:var(--muted);font-size:13px}
body.wallmode header,body.wallmode nav,body.wallmode .skip{display:none}
body.wallmode main{max-width:none;padding:12px 18px}
body.wallmode{--wbg:#fff;--wink:#000;--wmut:#2b2b2b;--wline:#000;--wsr:#b00020;--wwt:#9a4f00;--wgd:#056b35;--wnd:#555;background:var(--wbg);color:var(--wink);font-size:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body.wallmode{--wbg:#000;--wink:#fff;--wmut:#dcdcdc;--wline:#fff;--wsr:#ff5a5a;--wwt:#ffb020;--wgd:#3ddc84;--wnd:#b0b0b0}}
:root[data-theme=dark] body.wallmode{--wbg:#000;--wink:#fff;--wmut:#dcdcdc;--wline:#fff;--wsr:#ff5a5a;--wwt:#ffb020;--wgd:#3ddc84;--wnd:#b0b0b0}
.wl-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-bottom:10px;border-bottom:3px solid var(--wline)}
.wl-site{font-size:34px;font-weight:800;letter-spacing:.01em}.wl-clock{font:700 34px var(--mono)}
.wl-counts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:24px;font-weight:700}.wl-counts span{display:inline-flex;align-items:center;gap:6px}
.wl-fresh{font-size:18px;color:var(--wmut)}.wl-sp{flex:1}
.wl-btns{display:flex;gap:8px}.wl-btns button,.wl-btns a{font-size:16px;padding:6px 12px;border:2px solid var(--wline);background:var(--wbg);color:var(--wink);border-radius:6px;text-decoration:none}
.wl-stale{margin:10px 0;padding:14px 18px;border:4px solid var(--wsr);font-size:26px;font-weight:800;color:var(--wsr);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(128,128,128,.18) 14px 28px)}
.wl-hand{margin:12px 0;padding:12px 16px;border:3px dashed var(--wline);font-size:20px}.wl-hand.open{border-style:solid;border-width:4px}
.wl-hand h3{margin:0 0 6px;font-size:24px}.wl-hand .p{margin:4px 0;white-space:pre-wrap}.wl-hand .p b{display:inline-block;min-width:6.5em}
.wl-hand button{font-size:18px;padding:8px 14px;margin-top:6px}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px;margin-top:12px}
.wl-grid.stale .wl-tile,#wlHand.stale{opacity:.4}
.wl-tile{border:3px solid var(--wline);border-top-width:14px;border-radius:8px;padding:10px 14px 12px;background:var(--wbg)}
.wl-tile.st-SERIOUS{border-color:var(--wsr)}.wl-tile.st-WATCH{border-color:var(--wwt)}.wl-tile.st-GOOD{border-color:var(--wgd)}.wl-tile.st-NO_DATA{border-color:var(--wnd);border-style:dashed}
.wl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.wl-head h3{margin:0;font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.wl-state{display:inline-flex;align-items:center;gap:8px;font-size:28px;font-weight:800;white-space:nowrap}
.wl-why{margin:8px 0;padding-left:1.1em;font-size:20px;line-height:1.3}
.wl-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin:6px 0}.wl-m div{min-width:0}.wl-m dt{font-size:15px;color:var(--wmut);text-transform:uppercase;letter-spacing:.04em}.wl-m dd{margin:0;font:700 26px var(--mono)}
.wl-data{font-size:17px;color:var(--wmut);border-top:1px solid var(--wline);padding-top:6px;margin-top:4px}
.wl-foot{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:12px;font-size:17px;color:var(--wmut)}
.wl-ev{display:flex;flex-wrap:wrap;gap:4px 18px}

@media (max-width:640px){.wl-hand .p b{display:block}body.wallmode{font-size:16px}.wl-site,.wl-clock{font-size:24px}.wl-head h3{font-size:22px}.wl-state{font-size:20px}.wl-m dd{font-size:20px}}
.w3-wrap{position:relative}.w3-stage{position:relative;height:min(68vh,720px);min-height:340px;border:1px solid var(--grid);border-radius:10px;overflow:hidden;background:var(--surface);touch-action:none}
.w3-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#w3O{pointer-events:none}#w3C:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.w3-leg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:8px 0}.w3-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.w3-tg{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}.w3-tg>input{min-width:0!important;margin:0}
.w3-ramp{display:inline-flex;align-items:center;gap:6px}.w3-ramp .w3-bar{display:inline-block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,#86b6ef,#3987e5,#1c5cab,#0d366b)}
.w3-read{min-height:2.6em;font-size:14px;margin:4px 0 8px}
.ds-grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:12px;align-items:start}@media (max-width:900px){.ds-grid{grid-template-columns:minmax(0,1fr)}}

.ds-life{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.ds-lb{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--track);overflow:hidden}.ds-lb>span{display:block;height:100%;border-radius:4px}
.ds-leg{display:inline-flex;flex-wrap:wrap;gap:4px 12px;margin-left:8px}.ds-crow{margin:8px 0;padding:8px 10px}.ds-cbtn{display:inline-flex;gap:6px;margin-left:auto}.ds-ch{margin:10px 0}

.sim-tab{width:auto;min-width:min(420px,100%)}.sim-tab td{padding:3px 10px 3px 0;border:0}.sim-tab td.num{text-align:right;font-variant-numeric:tabular-nums}.w3-bar label>select{min-width:9em}

.os-ch text{font:11px var(--sans);fill:var(--muted)}.os-ch .os-lb{fill:var(--ink2)}.os-key{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0 10px}.os-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}.os-key i.band{border-radius:2px;background:var(--ink);opacity:.18;width:16px}.os-zoom{gap:6px;margin:6px 0}.os-zoom button{padding:2px 10px;font-size:12px}.os-ev{cursor:default}

<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <h1>GEA-Program</h1><span class="site" id="siteName"></span>
  <span class="spacer"></span>
  <form class="search" id="searchForm" role="search" hidden><input id="q" type="search" placeholder="Search wells, alarms, jobs…" aria-label="Search"><button class="secondary" type="submit">Find</button></form>
  <a id="whoami" class="small muted" href="#/prefs" title="your preferences"></a>
  <button class="secondary" id="helpBtn" type="button" aria-pressed="true" title="show or hide the help panels">Help</button>
  <button class="secondary" id="themeBtn" type="button" aria-pressed="false">Dark theme</button>
  <button class="secondary" id="logoutBtn" type="button" hidden>Sign out</button>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main" tabindex="-1"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
// ---------- helpers -------------------------------------------------------------------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d=2) => (v === null || v === undefined || v === '') ? '—' : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(d)) : esc(v));
function toast(msg, kind='') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 7000); }
async function api(method, path, body) {
  const opt = {method, headers: {'Content-Type': 'application/json'}};
  if (method === 'POST') { opt.headers['X-GEA-Action'] = '1'; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(path, opt);
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(d.error || (r.status + ' ' + r.statusText)); err.status = r.status; throw err; }
  return d;
}
const get = p => api('GET', p), post = (p, b) => api('POST', p, b);
function statusPill(kind, text) { return `<span class="status ${kind}"><span class="i" aria-hidden="true"></span>${esc(text)}</span>`; }
function classKind(c) { c = String(c || ''); if (/UNEXPLAINED|NOT_ACCEPTABLE|FAILED|SERIOUS|BAD|P1|P2/.test(c)) return 'serious'; if (/OFFSET|BAND_2|BAND_3|STALE|WARN|PENDING|P3/.test(c)) return 'warn'; if (/IN_FAMILY|MEETS|DONE|GOOD|APPROVED|CURRENT|MET\b|ACCEPTED/.test(c)) return 'good'; return 'neutral'; }
function readFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); }); }
const ROLE = {viewer:0, operator:1, approver:2, admin:3};
let me = null, workspaceName = '', PREFS = {units: 'field', time_zone: 'UTC', theme: 'auto', wizard_done: false, help_open: true}, SITE = {}, BADGES = {};
// time: every timestamp the service gives is UTC; the viewer sees it in the site's or their own zone
function tz(iso) { if (!iso) return '—'; const z = PREFS.time_zone || SITE.time_zone || 'UTC'; try { const d = new Date(String(iso).replace(' ', 'T').replace(/(Z|[+-]\d\d:?\d\d)?$/, m => m || 'Z')); if (isNaN(d)) return esc(iso); return new Intl.DateTimeFormat(undefined, {timeZone: z, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZoneName: 'short'}).format(d); } catch (e) { return esc(iso); } }
// units: field (psi, °F, ft, bbl/d) or SI (kPa, °C, m, m³/d); conversion only at display time, the files keep their units
const UNITS = {psi: ['kPa', v => v * 6.894757], psia: ['kPa', v => v * 6.894757], psig: ['kPa', v => v * 6.894757], degF: ['°C', v => (v - 32) / 1.8], '°F': ['°C', v => (v - 32) / 1.8], F: ['°C', v => (v - 32) / 1.8], ft: ['m', v => v * 0.3048], 'bbl/d': ['m³/d', v => v * 0.158987], STB_d: ['m³/d', v => v * 0.158987], 'Mscf/d': ['m³/d', v => v * 28.3168], 'lb/ft3': ['kg/m³', v => v * 16.0185], 'ft/h': ['m/h', v => v * 0.3048]};
function U(v, unit, d=2) { if (v === null || v === undefined || v === '' || typeof v !== 'number') return fmt(v, d); const si = (PREFS.units || SITE.units || 'field') === 'si'; const c = si && UNITS[unit]; return c ? `${fmt(c[1](v), d)} ${esc(c[0])}` : `${fmt(v, d)}${unit ? ' ' + esc(unit) : ''}`; }
function unitLabel(unit) { const si = (PREFS.units || SITE.units || 'field') === 'si'; return si && UNITS[unit] ? UNITS[unit][0] : unit; }
// help panels: the same text as `gea help <topic>` (gea/help/*.md), fetched once; a view maps to a topic
let HELPIDX = null;   // {topics: [{topic,title,summary}], views: {view: topic}}
async function loadHelp() { if (HELPIDX) return HELPIDX; try { HELPIDX = await get('/api/help'); } catch (e) { HELPIDX = {topics: [], views: {}}; } return HELPIDX; }
function help(view) { if (!PREFS.help_open || !HELPIDX) return ''; const t = HELPIDX.views[view]; const h = (HELPIDX.topics || []).find(x => x.topic === t); return h ? `<div class="help" role="note"><h4>${esc(h.title)}</h4><p>${esc(h.summary)} <a href="#/help/${esc(h.topic)}">more…</a></p></div>` : ''; }
function stamp() { document.querySelectorAll('h2').forEach(x => x.dataset.printed = tz(new Date().toISOString())); }
const can = r => me && ROLE[me.role] >= ROLE[r];
function need(r) { return can(r) ? '' : `<p class="muted small">Needs the ${r} role.</p>`; }
function reportLinks(dir, base) { return ['html','md','json','csv'].map(x => `<a href="/reports/${esc(dir)}/${esc(base)}.${x}" target="_blank" rel="noopener">${x}</a>`).join(' · ') + (can('operator') ? ` · <a href="#/files?report=${encodeURIComponent(dir + '/' + base + '.html')}" title="copy to an export root">save to…</a>` : ''); }

// ---------- charts (inline SVG, no library) -------------------------------------------
function lineChart(index, values, quality, unit, label) {
  const W = 900, H = 260, L = 56, R = 12, T = 18, B = 34;
  const pts = index.map((x, i) => [x, values[i]]).filter(p => p[1] !== null && p[1] !== undefined);
  if (!pts.length) return `<p class="muted">no numeric samples</p>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.08 || 1;
  const sx = x => L + (x - x0) / ((x1 - x0) || 1) * (W - L - R), sy = y => T + (1 - (y - (y0 - pad)) / ((y1 + pad) - (y0 - pad))) * (H - T - B);
  let grid = '', labels = '';
  for (let k = 0; k <= 4; k++) { const y = (y0 - pad) + k * ((y1 + pad) - (y0 - pad)) / 4; grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}"/>`; labels += `<text x="${L - 6}" y="${sy(y) + 4}" text-anchor="end">${y.toFixed(Math.abs(y) < 10 ? 2 : 0)}</text>`; }
  for (let k = 0; k <= 5; k++) { const x = x0 + k * (x1 - x0) / 5; labels += `<text x="${sx(x)}" y="${H - 10}" text-anchor="middle">${(x / 3600).toFixed(1)} h</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join('');
  let marks = '';
  index.forEach((x, i) => { const q = quality && quality[i]; if (q && q !== 'OK' && q !== 'GOOD' && values[i] !== null) marks += `<circle class="q" cx="${sx(x).toFixed(1)}" cy="${sy(values[i]).toFixed(1)}" fill="var(--warn)"><title>${esc(q)} at ${(x/3600).toFixed(2)} h: ${values[i]}</title></circle>`; });
  const desc = `${label}: ${pts.length} samples from ${ys[0]} to ${ys[ys.length-1]} ${unit}; min ${y0}, max ${y1}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}"><title>${esc(desc)}</title>${grid}<path class="line" d="${d}"/>${marks}${labels}<text x="${L}" y="12">${esc(label)} (${esc(unit)}) — flagged samples marked</text></svg>`;
}

// ---------- views ---------------------------------------------------------------------
const VIEWS = {};
VIEWS.home = async () => {
  const o = await get('/api/overview'); const d = o.dashboard, ws = o.workspace, site = (d && d.site) || {};
  const nDrift = d ? d.wells.filter(w => w.drift && w.drift.detected).length : 0;
  const active = d ? d.wells.reduce((n, w) => n + ((w.alarms && w.alarms.active) || []).length, 0) : 0;
  const unacked = d ? d.wells.reduce((n, w) => n + ((w.alarms && w.alarms.active) || []).filter(a => a.state === 'ACTIVE_UNACKED').length, 0) : 0;
  const q = await get('/api/approvals');
  let h = `<h2>${esc(SITE.display_name || ws.name)}</h2>${help('home')}<p class="muted small">Program ${esc(o.service.program_version)} · ${ws.n_wells} wells · service up since ${tz(o.service.started_utc)} · dashboard ${d ? 'generated ' + tz(d.generated_utc) : 'not yet generated'} · ${o.jobs_running.length} job(s) running</p>`;
  try { const sv = await get('/api/since'); if (sv.since) { const c = sv.counts || {}; const n = Object.values(c).reduce((a, b) => a + b, 0); h += `<div class="since"><span>Since your last visit (${tz(sv.since)}):</span><span><b>${sv.alarm_events}</b> alarm event(s)</span><span><b>${sv.jobs.total}</b> job(s), <b>${sv.jobs.failed}</b> failed</span><span><b>${n}</b> recorded action(s)${n ? ': ' + Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `${esc(k)} ×${v}`).join(', ') : ''}</span>${sv.alarm_items && sv.alarm_items.length ? `<span class="small">latest: ${sv.alarm_items.slice(0, 3).map(a => `${esc(a.event)} ${esc(a.alarm_id)} on ${esc(a.well)}`).join(' · ')}</span>` : ''}</div>`; } else h += `<div class="since"><span>Welcome - this is your first visit. The next sign-in will show what changed in between.</span></div>`; } catch (e) {}
  if (can('admin') && ws.n_wells === 0 && !PREFS.wizard_done && !SITE.wizard_done) h += `<div class="card wizard"><h3>New site</h3><p>No wells yet. The <a href="#/welcome">first-run guide</a> sets up units, the first well, users and the first refresh in four steps.</p></div>`;
  try { const ck = await get('/api/setup/checklist'); const c = ck.counts;
    if (!ck.ready) { const nx = ck.items.find(i => i.id === ck.next);
      h += `<div class="card ck-home"><h3>Setup: ${c.required_done} of ${c.required} required done</h3><div class="ck-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${c.required}" aria-valuenow="${c.required_done}" aria-label="Setup progress"><span style="width:${(100 * c.required_done / Math.max(1, c.required)).toFixed(0)}%"></span></div><p class="small">Next: <b>${esc(nx.title)}</b>${nx.well_name ? ' — ' + esc(nx.well_name) : ''}. <a href="#/setup">Open the setup checklist</a></p></div>`; } } catch (e) {}
  h += `<div class="tiles">`;
  h += tile('Wells with model drift detected', `${nDrift} of ${ws.n_wells}`, nDrift ? 'warn' : 'good', '#/wells');
  h += tile('Active alarms (unacknowledged)', `${active} (${unacked})`, unacked ? 'serious' : (active ? 'warn' : 'good'), '#/alarms');
  h += tile('Waiting for a decision', `${q.well_tests.length} tests · ${q.refits.length} re-fits`, (q.well_tests.length + q.refits.length) ? 'warn' : 'good', '#/approvals');
  if (site.accuracy) h += tile('Accuracy: quantities meeting 95 %', `${site.accuracy.bands.MEETS_TARGET || 0} of ${site.accuracy.n_ok}`, (site.accuracy.bands.NOT_ACCEPTABLE ? 'warn' : 'good'), '/reports/accuracy_statement.html', `${site.accuracy.pending} pending`);
  if (site.sla) h += tile(`SLA ${esc(site.sla.month)}`, `${site.sla.counts.MET||0} met / ${site.sla.counts['NOT MET']||0} not / ${site.sla.counts['NOT MEASURED']||0} n/m`, (site.sla.counts['NOT MET'] ? 'serious' : 'good'), site.sla.report ? '/reports/' + esc(site.sla.report.split('/reports/').pop()) : '#/reports');
  if (site.model_cards) h += tile('Model cards', site.model_cards.n, 'neutral', '#/reports');
  if (site.sbom) h += tile('Software bill of materials', site.sbom.n + ' components', 'neutral', '/reports/sbom.csv');
  const pc = o.patches || []; const pUp = pc.filter(p => p.status === 'CONNECTED').length, pBad = pc.filter(p => p.status === 'DOWN' || p.status === 'DEGRADED').length;
  h += tile('Patches connected', `${pUp} of ${pc.length}`, pBad ? 'serious' : (pc.length ? 'good' : 'neutral'), '#/live', pBad ? `${pBad} down or degraded` : '');
  if (site.certificates) { const cc = site.certificates.counts; h += tile('Calibration certificates', `${cc.VALID + cc.EXPIRING} of ${cc.VALID + cc.EXPIRING + cc.EXPIRED + cc.MISSING} in date`, (cc.EXPIRED || cc.MISSING) ? 'serious' : (cc.EXPIRING ? 'warn' : 'good'), '#/wells', `${cc.EXPIRING} expiring · ${cc.EXPIRED} expired · ${cc.MISSING} missing · ${site.certificates.swaps} swap(s) on record`); }
  if (site.transient && site.transient.shut_ins) h += tile('Build-ups analysed', `${site.transient.analysed} of ${site.transient.shut_ins} shut-ins`, 'neutral', '#/wells');
  if (o.tracks && o.tracks.length) { const tv = o.tracks.filter(t => t.verdict); h += tile('Seismic tracks', `${o.tracks.length}${tv.length ? ` · ${tv.filter(t => t.verdict === 'TRACKED').length} tracked of ${tv.length} judged` : ''}`, tv.some(t => t.verdict === 'NOT_TRACKED') ? 'warn' : 'neutral', '#/seismic', o.tracks.filter(t => t.heading_deg !== null && t.heading_deg !== undefined).map(t => `${t.display}: ${t.length_km} km on ${t.heading_deg}°`).join('; ')); }
  if (o.seismic && o.seismic.length) { const sd = o.seismic.filter(x => x.detected !== null && x.detected !== undefined); const det = sd.reduce((n, x) => n + x.detected, 0), tot = sd.reduce((n, x) => n + x.n_sources, 0); h += tile('Seismic stations', `${o.seismic.length}${sd.length ? ` · ${det} of ${tot} listed rigs heard` : ''}`, 'neutral', '#/seismic', o.seismic.filter(x => x.pointed !== null && x.pointed !== undefined).length ? `arrays pointed at ${o.seismic.reduce((n, x) => n + (x.pointed || 0), 0)}` : ''); }
  h += `</div>`;
  h += `<div class="row card">${can('operator') ? `<label>Month for the SLA (optional)<input id="month" placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></label><label><input type="checkbox" id="sat"> also run the SAT protocol</label><button id="refreshBtn" type="button">Refresh every report</button>` : need('operator')}<a class="btn secondary" href="/reports/index.html" target="_blank" rel="noopener">Open the printed dashboard</a></div>`;
  if (d) {
    h += `<h3>Well ranking</h3><table><thead><tr><th>Well</th><th>Drift</th><th>Worst station</th><th>Bias max (psi)</th><th>Quality, worst tag GOOD %</th><th>Active alarms</th><th>Well tests</th></tr></thead><tbody>`;
    for (const w of d.wells) {
      const wt = w.well_tests || {};
      h += `<tr><td><a href="#/wells/${esc(w.slug)}">${esc(w.name)}</a></td><td>${w.drift ? statusPill(w.drift.detected ? 'warn' : 'good', w.drift.detected ? 'drift detected' : 'in family') : '—'}</td><td>${w.drift ? statusPill(classKind(w.drift.worst), w.drift.worst) : '—'}</td><td>${w.drift ? fmt(w.drift.bias_max) : '—'}</td><td>${w.quality ? fmt(w.quality.pct_good_min, 1) : '—'}</td><td>${w.alarms ? (w.alarms.active || []).length : '—'}</td><td>${wt.accepted !== undefined ? `${wt.accepted} accepted / ${wt.rejected} rejected` : '—'}</td></tr>`;
    }
    h += `</tbody></table>`;
  } else h += `<p class="card">No reports yet. Add a well, then refresh every report.</p>`;
  $('#main').innerHTML = h;
  const b = $('#refreshBtn'); if (b) b.onclick = async () => { b.disabled = true; try { const j = await post('/api/refresh', {month: $('#month').value || null, sat: $('#sat').checked}); toast('Refresh started: job ' + j.id, 'ok'); watch(j.id, () => route()); } catch (e) { toast(e.message, 'err'); } b.disabled = false; };
};
function tile(l, v, kind, href, note) { const inner = `<div class="l">${esc(l)}</div><div class="v ${kind}">${statusPill(kind, '')} ${esc(v)}</div>${note ? `<div class="n">${esc(note)}</div>` : ''}`; return `<a class="tile" href="${esc(href)}" style="text-decoration:none;color:inherit" ${href.startsWith('/reports') ? 'target="_blank" rel="noopener"' : ''}>${inner}</a>`; }

VIEWS.wells = async () => {
  const {wells} = await get('/api/wells');
  let h = `<h2>Wells</h2><table><thead><tr><th>Well</th><th>Kind</th><th>Source</th><th>Added</th><th></th></tr></thead><tbody>`;
  for (const w of wells) h += `<tr><td><a href="#/wells/${esc(w.id)}">${esc(w.display)}</a></td><td>${esc(w.kind)}</td><td class="small mono">${esc(w.kind === 'catalog' ? w.source.entry + ' / ' + w.source.well : (w.kind === 'live' ? w.source.port + ' · ' + w.source.config : (w.source.original_path || w.files[0])))}</td><td class="small">${esc(w.added_utc)} by ${esc(w.added_by)}</td><td>${can('admin') ? `<button class="secondary danger" data-remove="${esc(w.id)}" type="button">Remove</button>` : ''}</td></tr>`;
  h += `</tbody></table>`;
  h += `<div class="card" id="pp" hidden><h3>Drilling progress <span class="small muted">days against depth, every drilling-recorder well</span></h3><div class="pp-body"></div></div>`;
  if (can('operator')) {
    h += `<div class="card"><h3>Add a well from a file</h3><p class="small muted">Historian CSV export, LAS 2.0 log, operator table or SEG-Y. The file is copied into the workspace verbatim and hashed; your original is never touched.</p>
      <div class="row"><label>Display name<input id="fName"></label><label>File<input type="file" id="fFile"></label><label>Station MD (ft, optional)<input id="fMd" type="number" step="1"></label><button id="fAdd" type="button">Add file well</button></div></div>`;
    h += `<div class="card"><h3>Add a catalogue well</h3><p class="small muted">A public archive entry shipped with the program (52 entries, each with a provenance file).</p>
      <div class="row"><label>Entry<select id="cEntry"></select></label><label>Well tag inside the entry<input id="cWell" placeholder="15/9-F-12"></label><label>Station MD (ft)<input id="cMd" type="number" value="10000"></label><label>Display name (optional)<input id="cName"></label><button id="cAdd" type="button">Add catalogue well</button></div></div>`;

       + tile('On bottom', fmt(dr.on_bottom_hours, 1) + ' h', 'neutral', '#/wells/' + id, fmt(dr.rotating_hours, 1) + ' h rotating')

    for (const x of dr.sections) h += `<tr><td>${x.n}</td><td class="small">${tz(x.start)}</td><td class="small">${tz(x.end)}</td><td>${fmt(x.hours, 1)}</td><td>${x.gap_before_hours != null ? fmt(x.gap_before_hours, 1) : '—'}</td><td class="small">${x.hole_depth_at_start_ft != null ? fmt(x.hole_depth_at_start_ft, 0) + ' → ' + fmt(x.hole_depth_to_ft, 0) : '—'}</td><td>${x.feet_drilled != null ? fmt(x.feet_drilled, 0) : '—'}</td><td>${fmt(x.on_bottom_hours, 1)}</td><td>${x.rop_on_bottom_mean_ft_h != null ? fmt(x.rop_on_bottom_mean_ft_h, 1) : '—'}</td><td>${x.connections != null ? x.connections : '—'}</td><td>${x.wob_max_klbf != null ? fmt(x.wob_max_klbf, 1) : '—'}</td><td>${x.rpm_max != null ? fmt(x.rpm_max, 0) : '—'}</td><td>${x.spp_max_psi != null ? fmt(x.spp_max_psi, 0) : '—'}</td></tr>`;

// the downhole tool library: a chip per class; hover or focus shows the one-line, click / tap / Enter opens the tutorial
let TLX = null;
function tlDialog() {
  let d = document.getElementById('tlDlg');
  if (d) return d;
  d = document.createElement('dialog'); d.id = 'tlDlg'; d.className = 'tl-dlg'; d.setAttribute('aria-labelledby', 'tlDlgTitle');
  d.addEventListener('click', ev => { if (ev.target === d) d.close(); });            // a click on the backdrop closes it
  d.addEventListener('close', () => { const back = d._opener; if (back && document.body.contains(back)) back.focus(); });
  document.body.appendChild(d); return d;
}
function tlOpen(id, opener) {

  const box = (r, title) => { g.strokeStyle = '#2a3542'; g.strokeRect(r[0], r[1], r[2], r[3]); g.fillStyle = '#9fb0c0'; g.fillText(title, r[0], r[1] - 6); };
  box(P.map, 'Map · two arrays, the lateral, the track');
  const pts = [...M.arrays.map(a => [a.x_km, a.y_km]), ...M.truth.map(t => [t.x_km, t.y_km])];
  for (const f2 of film.frames.slice(0, i + 1)) if (f2.position) pts.push([f2.position.x_km, f2.position.y_km]);
  const maxr = Math.max(1, ...pts.map(([x, y]) => Math.max(Math.abs(x), Math.abs(y)))) * 1.15; const mx = P.map[0] + P.map[2] / 2, my = P.map[1] + P.map[3] / 2, sc = (P.map[2] / 2) / maxr;
  const X = (x, y) => [mx + x * sc, my - y * sc];
  // the lateral (truth)
  g.strokeStyle = '#6fd3a0'; g.lineWidth = 2; g.beginPath(); M.truth.forEach((t, k) => { const [x, y] = X(t.x_km, t.y_km); if (k) g.lineTo(x, y); else g.moveTo(x, y); }); g.stroke(); g.lineWidth = 1;
  if (fr.truth) { const [x, y] = X(fr.truth.x_km, fr.truth.y_km); g.fillStyle = '#6fd3a0'; g.beginPath(); g.arc(x, y, 4, 0, 2 * Math.PI); g.fill(); g.fillText('bit', x + 6, y - 4); }
  // the arrays and their bearings
  M.arrays.forEach((a, k) => { const [x, y] = X(a.x_km, a.y_km); g.fillStyle = '#9fb0c0'; g.beginPath(); g.arc(x, y, 4, 0, 2 * Math.PI); g.fill(); g.fillText(a.name, x + 6, y + 12);
    const b = fr.beams[k]; if (b && b.back_azimuth_deg !== null) { const th = b.back_azimuth_deg * Math.PI / 180, L = P.map[2] * 0.6; g.strokeStyle = b.coherent ? '#ffd166' : '#55667a'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + L * Math.sin(th), y - L * Math.cos(th)); g.stroke(); } });
  // the positions so far, with ellipses
  film.frames.slice(0, i + 1).forEach((f2, k) => { if (!f2.position) return; const p = f2.position, e = p.ellipse_1sigma, last = k === i; const [x, y] = X(p.x_km, p.y_km);
    g.save(); g.translate(x, y); g.rotate(-(e.major_azimuth_deg || 0) * Math.PI / 180 + Math.PI / 2); g.strokeStyle = last ? '#ff6b6b99' : '#ff6b6b33'; g.beginPath(); g.ellipse(0, 0, Math.max(e.major_km * sc, 1), Math.max(e.minor_km * sc, 1), 0, 0, 2 * Math.PI); g.stroke(); g.restore();
    g.fillStyle = last ? '#ff6b6b' : '#ffb3b3'; g.beginPath(); g.arc(x, y, last ? 4 : 2, 0, 2 * Math.PI); g.fill(); });
  // the text pane
  const T = P.text; let y = T[1] + 14; const line = (txt, col) => { g.fillStyle = col || '#d7e0ea'; g.fillText(txt, T[0], y); y += 16; };
  line(`Window ${i + 1} of ${n} · hour ${fr.hour.toFixed(2)} · ${fr.truth ? 'the bit is advancing along the lateral' : 'the lateral is quiet'}`, '#ffffff');
  fr.beams.forEach(b => line(`${b.array}: ${b.back_azimuth_deg === null ? 'no beam' : `bearing ${b.back_azimuth_deg}° (±${b.tolerance_deg}°), coherence ${b.coherence_max_bin}, ${b.coherent_bins} bins`}${b.coherent ? '' : ' - not coherent'}`, b.coherent ? '#ffd166' : '#9fb0c0'));
  if (fr.position) line(`crossing: ${fr.position.x_km.toFixed(2)} E, ${fr.position.y_km.toFixed(2)} N km · ellipse ${fr.position.ellipse_1sigma.major_km.toFixed(2)}×${fr.position.ellipse_1sigma.minor_km.toFixed(2)} km · ${fr.position.crossing_angle_deg}°`, '#ffb3b3');
  else line(`no position: ${fr.gap || 'gap'}`, '#9fb0c0');
  line(`positions so far: ${fr.positions_so_far}`);
  if (i === n - 1 && film.final) { const t = film.final.track || {}, v = film.final.verdict || {}; line('Closing - the tracker on the whole scene:', '#ffffff');
    if (t.heading_deg !== null && t.heading_deg !== undefined) line(`  longest segment: ${t.n_positions} positions, heading ${t.heading_deg}°, length ${t.length_km} km`, '#6fd3a0');
    if (t.n_segments > 1) line(`  ${t.n_segments} segments (a jump larger than the ellipses splits them)`, '#9fb0c0');
    line(`  verdict vs the lateral: ${v.verdict} (${v.n_hit}/${v.n_compared} in their ellipse${v.n_outside_truth ? `; ${v.n_outside_truth} outside its time` : ''})`, v.verdict === 'TRACKED' ? '#6fd3a0' : '#ffb3b3'); }
  const cap = $('#sarCaption'); if (cap && i === n - 1 && film.final) cap.textContent = `Closing: ${film.final.n_positions} positions; verdict ${(film.final.verdict || {}).verdict}. ${film.closing}`;
}

function layersCardHtml(layers) {

  if (layers.length) {
    h += `<table><thead><tr><th>Layer</th><th>Features</th><th>Types</th><th>Coordinates</th><th>Extent (lon, lat)</th><th>Source</th><th></th></tr></thead><tbody>`;
    for (const L of layers) { const tc = Object.entries(L.type_counts || {}).slice(0, 4).map(([k, v]) => `${esc(k)} ${v}`).join(', ');
      const md = L.metadata || {}; const src = (md.titles || []).slice(1, 2).join('') || (md.titles || [])[0] || '';
      h += `<tr><td>${esc(L.display)}<div class="mono small muted">${esc(L.base)}.shp · ${esc(L.kind || 'structure')}${L.value_attr ? ' · ' + esc(L.value_attr) : ''}</div></td><td>${L.n_features}</td><td class="small">${tc}${Object.keys(L.type_counts || {}).length > 4 ? ', …' : ''}</td><td class="small">${esc(L.crs.kind)} ${esc(L.crs.datum || '')}</td><td class="small mono">${L.bbox.map(v => fmt(v, 2)).join(', ')}</td><td class="small">${esc(src)}${(md.pubdates || [])[0] ? ' (' + esc(md.pubdates[0]) + ')' : ''}${L.citation ? '<div class="muted">' + esc(L.citation) + '</div>' : ''}</td><td>${can('admin') ? `<button class="secondary danger" data-lrm="${esc(L.id)}" type="button">Remove</button>` : ''}</td></tr>`; }
    h += `</tbody></table>`;
  } else h += `<p class="muted small">No structure layer yet.</p>`;
  if (can('operator')) h += `<div class="row"><label>Display name<input id="lyName" placeholder="EIA Permian faults (2017)"></label><label>Shapefile zip (.shp, .shx, .dbf, .prj together)<input type="file" id="lyFile" accept=".zip"></label><label>Shapefile inside the zip (when it holds several)<select id="lyMember"><option value="">— pick the zip first —</option></select></label><label>Citation (where the map came from)<input id="lyCite" style="min-width:20em"></label><label>Formation (a contours layer)<input id="lyFm" placeholder="Wolfcamp" style="width:9em"></label><label>Role<select id="lyRole"><option value="">—</option><option value="top">top elevation</option><option value="isopach">thickness (isopach)</option><option value="base">base elevation</option></select></label><label>Every feature is<select id="lyFK"><option value="">(as the attributes say)</option><option value="fault">a fault</option><option value="fold">a fold</option></select></label><button id="lyAdd" type="button">Add layer</button></div>`;
  return h + `</div>`;
}

      <div class="row"><label>World Stress Map CSV<input type="file" id="smFile" accept=".csv"></label><label>Citation<input id="smCite" placeholder="World Stress Map 2016, Heidbach et al., CC BY 4.0" style="min-width:18em"></label><button class="secondary" id="smAdd" type="button">Add stress map</button></div>`;

function slipCardHtml(sl) {
  let h = `<div class="card"><h3>Slip tendency on the mapped faults <span class="small muted">from the declared stress state</span></h3>`;
  h += `<p class="small"><b>${esc(sl.status)}</b>${sl.note ? ': ' + esc(sl.note) : ''}</p>`;

  for (const L of (sl.layers || [])) { if (!L.faults || !L.faults.length) continue;

        <table><thead><tr><th>Source</th><th>Verdict</th><th>Spells heard</th><th>Heard</th><th>Declared</th><th>Declared and heard</th><th>Declared but silent</th><th>Heard, not declared</th></tr></thead><tbody>`;
      for (const a of judged) { const g = a.agreement || {};
        h += `<tr><td>${esc(a.source_id)}</td><td>${statusPill(a.verdict === 'AGREES' ? 'good' : (a.verdict === 'DIFFERS' ? 'warn' : 'neutral'), a.verdict)}</td><td>${a.n_spells}</td><td>${a.heard_windows} of ${a.n_windows}</td><td>${g.declared_windows !== undefined ? g.declared_windows : '—'}</td><td>${g.declared_and_heard !== undefined ? g.declared_and_heard : '—'}</td><td>${g.declared_but_silent !== undefined ? g.declared_but_silent : '—'}</td><td>${g.heard_but_not_declared !== undefined ? g.heard_but_not_declared : '—'}</td></tr>`; }
      h += `</tbody></table>`;
      for (const a of judged) if ((a.spells || []).length) h += `<p class="small muted">${esc(a.source_id)}: ${a.spells.map(s => `${esc(s.start_utc)} → ${esc(s.end_utc)} (${fmt(s.hours, 2)} h)`).join(' · ')}</p>`;
    }
    h += `<p class="small muted">Not a measurement: ${(TL.not_a_measurement || []).map(esc).join('; ')}.</p></div>`; }
  if (R.lines && R.lines.lines && R.lines.lines.length) { h += `<div class="card"><h3>Persistent lines <span class="small muted">${R.lines.band_hz[0]}–${R.lines.band_hz[1]} Hz, ${R.lines.windows} windows of ${R.lines.win_s} s</span></h3><table><thead><tr><th>Frequency (Hz)</th><th>Over the floor (dB)</th><th>Present in</th></tr></thead><tbody>`;
    for (const l of R.lines.lines.slice(0, 20)) h += `<tr><td class="mono">${fmt(l.freq_hz, 3)}</td><td>${fmt(l.median_excess_db, 1)}</td><td>${l.present_windows} of ${l.windows} windows</td></tr>`;
    h += `</tbody></table><p class="small muted">A persistent line is consistent with machinery; it does not name the machine.</p></div>`; }
  if (R.detect) { const D = R.detect; h += `<div class="card"><h3>Detectability <span class="small muted">${esc(D.status)} · ${D.quiet_windows} quiet of ${D.windows} windows</span></h3>`;
    if (D.detail) h += `<p class="small">${esc(D.detail)}</p>`;
    h += `<table><thead><tr><th>Source</th><th>Distance (km)</th><th>Verdict</th><th>Over quiet (dB)</th><th>Its lines (Hz)</th></tr></thead><tbody>`;
    for (const r of D.sources.slice().sort((a, b) => a.distance_km - b.distance_km)) h += `<tr><td>${esc(r.source_id)}</td><td>${fmt(r.distance_km, 1)}</td><td>${statusPill(r.verdict === 'DETECTED' ? 'good' : (r.verdict === 'NOT_DETECTED' ? 'warn' : 'neutral'), r.verdict)}</td><td>${r.excess_over_quiet_db !== undefined ? fmt(r.excess_over_quiet_db, 1) : '—'}</td><td class="small mono">${(r.lines_hz || []).slice(0, 6).map(x => fmt(x, 2)).join(', ') || '—'}</td></tr>`;
    h += `</tbody></table><p class="small"><b>Radius:</b> ${esc(D.radius)}</p><p class="small muted">Not a measurement: ${D.not_a_measurement.map(esc).join('; ')}.</p></div>`; }
  if (R.beam) { const B = R.beam, r = B.resolution; h += `<div class="card"><h3>Array <span class="small muted">${B.n_sensors} sensors, aperture ${B.aperture_km} km, ${B.method}</span></h3><p>Back-azimuth <b>${fmt(B.back_azimuth_deg, 1)}°</b> ± ${fmt(r.azimuth_half_width_deg, 1)}° (array response) · slowness ${fmt(B.slowness_s_km, 3)} s/km (apparent velocity ${fmt(B.apparent_velocity_km_s, 2)} km/s) · best-bin coherence ${fmt(B.coherence_max_bin, 2)} with ${B.coherent_bins} coherent bins${B.coherent_frequencies_hz.length ? ` at ${B.coherent_frequencies_hz.slice(0, 6).map(x => fmt(x, 1)).join(', ')} Hz` : ''}.${r.aliasing_lobes ? ' <b>The geometry has aliasing lobes at this band: a lone peak may be a lobe.</b>' : ''} Sources nearer than ${B.plane_wave_limit_km} km are not plane waves here.</p>`;
    if (R.array_detect) { h += `<table><thead><tr><th>Source</th><th>Distance (km)</th><th>True bearing</th><th>Beam</th><th>Error</th><th>Tolerance</th><th>Verdict</th></tr></thead><tbody>`;
      for (const r2 of R.array_detect.sources) h += `<tr><td>${esc(r2.source_id)}</td><td>${fmt(r2.distance_km, 1)}</td><td>${fmt(r2.true_back_azimuth_deg, 1)}°</td><td>${r2.beam_back_azimuth_deg !== undefined ? fmt(r2.beam_back_azimuth_deg, 1) + '°' : '—'}</td><td>${r2.azimuth_error_deg !== undefined ? fmt(r2.azimuth_error_deg, 1) + '°' : '—'}</td><td>${r2.tolerance_deg !== undefined ? fmt(r2.tolerance_deg, 1) + '°' : '—'}</td><td>${statusPill(r2.verdict === 'POINTED' ? 'good' : (r2.verdict === 'NOT_POINTED' ? 'warn' : 'neutral'), r2.verdict)}</td></tr>`;
      h += `</tbody></table>`; }
    h += `<p class="small muted">Not a measurement: ${B.not_a_measurement.map(esc).join('; ')}.</p></div>`; }
  $('#main').innerHTML = h;
  const b = $('#sRefresh'); if (b) b.onclick = async () => { b.disabled = true; try { const j = await post(`/api/seismic/${id}/refresh`); toast('Refresh started: job ' + j.id, 'ok'); watch(j.id, () => route()); } catch (e) { toast(e.message, 'err'); } b.disabled = false; };
  const hc = $('#htr'); if (hc && R.harmonics && R.harmonics.line_tracks.tracks.length) { const TL = R.harmonics.line_tracks;
    const c = hc.getContext('2d'), W = hc.width, H = hc.height, fg = getComputedStyle(document.body).color;
    const all = TL.tracks.flatMap(t => t.freqs_hz); const lo = Math.min(...all), hi = Math.max(...all), nw = Math.max(TL.n_windows - 1, 1);
    const X = i => 54 + (W - 64) * i / nw, Y = f => H - 30 - (H - 44) * (f - lo) / ((hi - lo) || 1);
    c.clearRect(0, 0, W, H); c.strokeStyle = fg; c.globalAlpha = 0.25; c.strokeRect(54.5, 10.5, W - 64, H - 44); c.globalAlpha = 1;
    c.font = '12px system-ui'; c.fillStyle = fg;
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = H - 30 - (H - 44) * i / 4; c.fillText(v.toFixed(2), 2, y + 4); }
    for (let i = 0; i <= 5; i++) { const w = Math.round(nw * i / 5); c.fillText('w' + w, X(w) - 8, H - 12); }
    c.fillText('Hz', 2, 10);
    for (const t of TL.tracks) { c.beginPath(); c.setLineDash(t.status === 'STEADY' ? [4, 3] : []); c.globalAlpha = t.status === 'INTERMITTENT' ? 0.45 : 0.95;
      for (let k = 0; k < t.windows.length; k++) { const x = X(t.windows[k]), y = Y(t.freqs_hz[k]); k ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = fg; c.lineWidth = t.status === 'DRIFTING' ? 1.8 : 1.2; c.stroke(); }
    c.setLineDash([]); c.globalAlpha = 1; }
  const cv = $('#psd'); if (cv && R.spectrum) { const c = cv.getContext('2d'), W = cv.width, H = cv.height, F = R.spectrum.freqs_hz, P = R.spectrum.psd_db; const fg = getComputedStyle(document.body).color; const lo = Math.min(...P), hi = Math.max(...P), f0 = F[0], f1 = F[F.length - 1]; c.clearRect(0, 0, W, H); c.strokeStyle = fg; c.globalAlpha = 0.25; c.strokeRect(50.5, 10.5, W - 60, H - 40); c.globalAlpha = 1; c.font = '12px system-ui'; c.fillStyle = fg;
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = H - 30 - (H - 40) * i / 4; c.fillText(v.toFixed(0) + ' dB', 2, y + 4); } for (let i = 0; i <= 5; i++) { const f = f0 + (f1 - f0) * i / 5, x = 50 + (W - 60) * i / 5; c.fillText(f.toFixed(1) + ' Hz', x - 14, H - 12); }
    c.beginPath(); for (let i = 0; i < F.length; i++) { const x = 50 + (W - 60) * (F[i] - f0) / (f1 - f0 || 1), y = H - 30 - (H - 40) * (P[i] - lo) / ((hi - lo) || 1); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.strokeStyle = fg; c.lineWidth = 1.2; c.stroke(); }
};

VIEWS.live = async () => {
  const {patches, protocols} = await get('/api/patches'); const {wells} = await get('/api/wells');
  let h = `<h2>Patch panel</h2><p class="small muted">A patch is a supervised connection from a source on the site network to a well: the drill floor over WITS0 (mud logger, EDR), a WITSML store, an OPC UA server, an MQTT broker or a Modbus device. The service keeps every enabled patch up, reconnects with backoff when the source drops, and writes every record to the well's live files. No credential is ever in a map; only the names of the environment variables that hold them.</p>`;
  h += `<table><thead><tr><th>Patch</th><th>Protocol</th><th>Well</th><th>State</th><th>Since</th><th>Last sample</th><th>Samples/min</th><th>Latency p50 / p95</th><th>Reconnects</th><th></th></tr></thead><tbody>`;
  const kind = st => ({CONNECTED: 'good', CONNECTING: 'warn', DEGRADED: 'warn', DOWN: 'serious', STOPPED: 'neutral'}[st] || 'neutral');
  for (const p of patches) h += `<tr><td><a href="#/live/${esc(p.name)}">${esc(p.name)}</a>${p.patch.enabled ? '' : ' <span class="small muted">(disabled)</span>'}</td><td class="mono">${esc(p.protocol)}</td><td><a href="#/wells/${esc(p.well_id)}">${esc(p.well_id)}</a></td><td>${statusPill(kind(p.status), p.status)}${p.last_error && p.status !== 'CONNECTED' ? `<div class="small muted">${esc(p.last_error).slice(0, 90)}</div>` : ''}</td><td class="small">${esc(p.since_utc)}</td><td class="small">${esc(p.last_sample_utc) || '—'}</td><td>${p.samples_last_min}</td><td>${fmt(p.latency_p50_s, 3)} / ${fmt(p.latency_p95_s, 3)} s</td><td>${p.reconnects}</td><td>${can('operator') ? (p.status === 'STOPPED' ? `<button data-pa="start" data-n="${esc(p.name)}" type="button">Start</button>` : `<button class="secondary" data-pa="stop" data-n="${esc(p.name)}" type="button">Stop</button>`) : ''}</td></tr>`;
  if (!patches.length) h += `<tr><td colspan="10" class="muted">no patches yet</td></tr>`;
  h += `</tbody></table>`;
  if (can('operator')) {
    h += `<div class="card"><h3>Add a patch</h3><div class="row"><label>Name<input id="pName" placeholder="floor"></label><label>Protocol<select id="pProto">${protocols.map(x => `<option>${x}</option>`).join('')}</select></label><label>Well<select id="pWell">${wells.map(w => `<option value="${esc(w.id)}">${esc(w.display)}</option>`).join('')}</select></label><label>Priority<input id="pPrio" type="number" value="1" min="1" style="width:70px"></label><label>Stale after (s)<input id="pStale" type="number" value="120" min="1" style="width:90px"></label><label><input type="checkbox" id="pAuto" checked> auto-restart</label><button class="secondary" id="pExample" type="button">Load the example map</button><button id="pAdd" type="button">Add and start</button></div><label>Map (JSON)<textarea id="pCfg" spellcheck="false"></textarea></label>
      <p class="small muted">To rehearse without a rig: in a command window run <span class="mono">gea wits0-sim --port 5001</span> (a WITS0 sender) and add a WITS0 patch with transport tcp, host 127.0.0.1, port 5001.</p></div>`;
  } else h += need('operator');
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await post(`/api/patches/${b.dataset.n}/${b.dataset.pa}`); toast(`${b.dataset.n}: ${r.status || 'ok'}`, 'ok'); setTimeout(route, 800); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  const ex = $('#pExample'); if (ex) { ex.onclick = async () => { try { const d = await get('/api/config/defaults/' + $('#pProto').value); $('#pCfg').value = JSON.stringify(d.content, null, 1); } catch (e) { toast(e.message, 'err'); } };
    $('#pAdd').onclick = async () => { let cfg; try { cfg = JSON.parse($('#pCfg').value); } catch (e) { return toast('The map is not valid JSON', 'err'); } try { const p = await post('/api/patches/add', {name: $('#pName').value, protocol: $('#pProto').value, well_id: $('#pWell').value, config: cfg, priority: +$('#pPrio').value, stale_after_s: +$('#pStale').value, auto_restart: $('#pAuto').checked}); await post(`/api/patches/${p.name}/start`); toast('Patch ' + p.name + ' added and started', 'ok'); location.hash = '#/live/' + p.name; } catch (e) { toast(e.message, 'err'); } }; }

VIEWS.patch = async (name) => {

  if (can('operator')) h += `<div class="row card">${p.status === 'STOPPED' ? `<button data-pa="start" type="button">Start</button>` : `<button class="secondary" data-pa="stop" type="button">Stop</button>`}<button class="secondary" data-pa="update" data-f="enabled" data-v="${p.patch.enabled ? 'false' : 'true'}" type="button">${p.patch.enabled ? 'Disable' : 'Enable'}</button><button class="secondary" data-pa="update" data-f="auto_restart" data-v="${p.patch.auto_restart ? 'false' : 'true'}" type="button">${p.patch.auto_restart ? 'Turn auto-restart off' : 'Turn auto-restart on'}</button>${can('admin') ? `<button class="secondary danger" data-pa="remove" type="button">Remove</button>` : ''}</div>`;

  h += `<div class="card"><h3>Live values (${tags.length} tags)</h3><table><thead><tr><th>Tag</th><th>Value</th><th>Unit</th><th>Quality</th><th>Source time</th></tr></thead><tbody>${tags.map(([t, v]) => `<tr><td class="mono">${esc(t)}</td><td>${fmt(v.value, 3)}</td><td>${esc(v.unit)}</td><td>${statusPill(v.quality === 'GOOD' ? 'good' : (v.quality === 'GAP' ? 'serious' : 'warn'), v.quality)}</td><td class="small">${esc(v.timestamp_utc)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">nothing received yet</td></tr>'}</tbody></table></div>`;
  h += `<div class="card"><h3>Map</h3>${can('operator') ? `<label>JSON<textarea id="pmCfg" spellcheck="false"></textarea></label><button id="pmSave" type="button">Validate and save (versioned; takes effect on the next start)</button>` : ''}</div>`;
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => { const a = b.dataset.pa; if (a === 'remove' && !confirm('Remove patch ' + name + '?')) return; b.disabled = true; try { const body = a === 'update' ? {[b.dataset.f]: b.dataset.v === 'true'} : {}; await post(`/api/patches/${name}/${a}`, body); toast(`${name}: ${a}`, 'ok'); if (a === 'remove') location.hash = '#/live'; else setTimeout(route, 800); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });
  const ta = $('#pmCfg'); if (ta) { try { const c = await get(`/api/patches/${name}/config`); ta.value = JSON.stringify(c.config, null, 1); } catch (e) {} $('#pmSave').onclick = async () => { let cfg; try { cfg = JSON.parse(ta.value); } catch (e) { return toast('not valid JSON', 'err'); } try { const m = await post(`/api/patches/${name}/config`, {config: cfg}); toast('Saved as version ' + m.version, 'ok'); } catch (e) { toast(e.message, 'err'); } }; }

function shelveDialog(wellId, alarmId) {
  const hrs = prompt(`Shelve ${alarmId} for how many hours? (blank = until someone unshelves it; maximum 2160)`, '8');
  if (hrs === null) return;
  const note = prompt('Reason (recorded on the event, shown in the report):', '');
  if (note === null) return;
  if (!note.trim()) { toast('A shelf needs a reason', 'err'); return; }
  post('/api/alarms/shelve', {well_id: wellId, alarm_id: alarmId, hours: hrs.trim() ? +hrs : null, note}).then(j => { toast(`Shelved ${alarmId} (${j.status})`, j.status === 'DONE' ? 'ok' : 'err'); route(); }).catch(e => toast(e.message, 'err'));
}
// ---------- program alerts: earthquakes, the watch, motors, penetrators, dossiers ----------
const AL_NAMES = {'seismic.protocol': 'Protocol level reached', 'seismic.event': 'Earthquake near an operation', 'seismic.watch_down': 'Earthquake watch not reaching the catalogue', 'seismic.watch_up': 'Earthquake watch back', 'motor.due': 'Service interval used up', 'penetrator.outside': 'Penetrator outside its rating', 'dossier.changed': 'Workspace no longer matches a dossier', 'condition.cleared': 'Cleared'};
function alKind(e) { return ({'seismic.protocol': 'serious', 'seismic.watch_down': 'serious', 'penetrator.outside': 'serious', 'dossier.changed': 'serious', 'motor.due': 'warn', 'seismic.event': 'warn'})[e] || 'good'; }
async function alCard() {
  let A; try { A = await get('/api/alerts'); } catch (e) { return ''; }
  const rows = A.alerts.slice(0, 50);
  let h = `<div class="card" id="alCard"><h3>Program alerts <span class="small muted">earthquakes near operating wells, the earthquake watch, components due for service, penetrators outside their ratings, dossiers the workspace no longer matches</span></h3>`;
  if (!A.notifications_configured) h += `<p class="small">${statusPill('warn', 'NOT SENT')} No notification channel is set up, so these are recorded here and nowhere else. Add an email or webhook channel and a rule per alert (<span class="mono">seismic.protocol</span>, <span class="mono">motor.due</span> …) under <a href="#/admin">Administration, Notifications</a>. <a href="#/help/alerts">How</a>.</p>`;
  h += rows.length ? `<div style="overflow-x:auto"><table class="small"><thead><tr><th>When (UTC)</th><th>Alert</th><th>Well</th><th>What</th><th>Sent to</th></tr></thead><tbody>${rows.map(r => `<tr><td>${tz(r.utc)}</td><td>${statusPill(alKind(r.event), AL_NAMES[r.event] || r.event)}${r.event === 'condition.cleared' ? `<br><span class="muted">${esc(AL_NAMES[r.cleared] || r.cleared || '')}</span>` : ''}</td><td>${esc(r.well || '')}</td><td>${esc(r.detail || '')}</td><td>${(r.delivered || []).map(d => esc(d.channel) + (d.ok ? '' : ' (failed)')).join(', ') || '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">No alerts yet.</p>';
  return h + `</div>`;
}
VIEWS.alarms = async () => {

  for (const w of wells) { try { const d = await get('/api/wells/' + w.id); const r = d.reports.alarm_event_report; if (r) { for (const a of (r.active || [])) rows.push({well: w, a}); for (const a of (r.shelved || [])) shelved.push({well: w, a}); } } catch (e) {} }
  rows.sort((x, y) => (x.a.priority > y.a.priority ? 1 : -1) || (x.a.state === 'ACTIVE_UNACKED' ? -1 : 1));
  const nUn = rows.filter(r => r.a.state === 'ACTIVE_UNACKED').length;
  let h = `<h2>Alarm wall</h2>${help('alarms')}<p class="small muted">${rows.length} active · ${nUn} unacknowledged · ${shelved.length} shelved. Acknowledging and shelving re-process the well's stream with your name on the event.</p>`;

  h += `<table><thead><tr><th>Priority</th><th>Well</th><th>Alarm</th><th>State</th><th>Since</th><th>Last value</th><th></th></tr></thead><tbody>`;

  if (!rows.length) h += `<tr><td colspan="7" class="muted">no active alarms</td></tr>`;
  h += `</tbody></table>`;
  if (shelved.length) { h += `<div class="card"><h3>Shelved</h3><table><thead><tr><th>Priority</th><th>Well</th><th>Alarm</th><th>Until</th><th>By</th><th>Reason</th><th></th></tr></thead><tbody>`;
    for (const {well, a} of shelved) h += `<tr><td>${statusPill(classKind(a.priority), a.priority)}</td><td><a href="#/wells/${esc(well.id)}">${esc(well.display)}</a></td><td class="mono">${esc(a.alarm_id)}</td><td class="small">${a.shelved_until_utc ? tz(a.shelved_until_utc) : 'until unshelved'}</td><td>${esc(a.shelved_by)}</td><td class="small">${esc(a.note)}</td><td>${can('operator') ? `<button class="secondary" data-uw="${esc(well.id)}" data-ua="${esc(a.alarm_id)}" type="button">Unshelve</button>` : ''}</td></tr>`;
    h += `</tbody></table></div>`; }
  h += `<div class="card"><h3>Alarm definitions</h3><p class="small muted">Setpoints, deadbands, on-delays and priorities, versioned in the configuration store as <span class="mono">alarm_definitions</span>.</p>${can('operator') ? `<div class="row"><button class="secondary" id="defLoad" type="button">Load current</button><button class="secondary" id="defDefault" type="button">Derive defaults from the first historian well</button><button id="defSave" type="button">Validate and commit</button></div><label>JSON<textarea id="defs" spellcheck="false"></textarea></label><label>Note<input id="defNote"></label>` : need('operator')}</div>`;
  $('#main').innerHTML = h;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { b.disabled = true; try { const j = await post('/api/alarms/ack', {well_id: b.dataset.w, alarm_id: b.dataset.a}); toast(`Acknowledged (${j.status})`, j.status === 'DONE' ? 'ok' : 'err'); route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });

  document.querySelectorAll('[data-ua]').forEach(b => b.onclick = async () => { b.disabled = true; try { const j = await post('/api/alarms/unshelve', {well_id: b.dataset.uw, alarm_id: b.dataset.ua}); toast(`Unshelved (${j.status})`, j.status === 'DONE' ? 'ok' : 'err'); route(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } });

// ---------- job watching ----------------------------------------------------------------
const watching = {};
function watch(id, done) { if (watching[id]) return; watching[id] = true; const tick = async () => { try { const j = await get('/api/jobs/' + id); if (j.status === 'QUEUED' || j.status === 'RUNNING') return setTimeout(tick, 2000); delete watching[id]; toast(`${j.label}: ${j.status}`, j.status === 'DONE' ? 'ok' : 'err'); if (done) done(j); } catch (e) { delete watching[id]; } }; setTimeout(tick, 1500); }

// ---------- the well in 3D: surveys made into paths, the mapped formations, the replay --------------------
// WebGL by hand (no library): surfaces as lit meshes, each well a tube, picks and the bit as markers; labels, axes and
// the north arrow on a 2D canvas laid over it. Depth is below sea level, positive down; the vertical exaggeration
// stretches it on screen only. Every number on the page comes from the scene the service built.
const W3 = {sc: null, gl: null, prog: null, lprog: null, meshes: [], lines: [], cam: null, exag: 2, colorBy: 'Formation', show: {}, rep: {well: null, i: 0, timer: null, speed: 1},
  hover: null, drag: null, raf: 0, box: null, ov: null, cvs: null, sceneId: null};
function w3Css(name) { return getComputedStyle(document.body).getPropertyValue(name).trim() || '#888'; }
function w3Hex(h) { h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
const W3_SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'];
const W3_RAMP = ['#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b'];   // one hue, light to dark

$('#logoutBtn').onclick = async () => { await post('/api/logout'); me = null; boot(); };
window.addEventListener('hashchange', route);
// theme: the account preference (Your preferences) unless this browser overrides it with the header button; otherwise the system
let themeLocal = null; try { themeLocal = localStorage.getItem('gea-theme'); } catch (e) {}
function applyTheme() { if (typeof W3 !== 'undefined' && W3.gl && W3.cvs && W3.cvs.isConnected) setTimeout(() => { w3Build(); w3Req(); }, 0); const t = themeLocal || (PREFS.theme && PREFS.theme !== 'auto' ? PREFS.theme : null); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#themeBtn').textContent = dark ? 'Light theme' : 'Dark theme'; $('#themeBtn').setAttribute('aria-pressed', String(dark)); }
$('#themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; themeLocal = dark ? 'light' : 'dark'; try { localStorage.setItem('gea-theme', themeLocal); } catch (e) {} applyTheme(); };
applyTheme();
boot().catch(e => { $('#main').innerHTML = `<div class="card"><h2>The service did not answer</h2><p>${esc(e.message)}</p></div>`; });
</script>
</body>
</html>
