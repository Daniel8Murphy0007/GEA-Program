# nginx in front of gea serve. Supply the certificate and key.
server {
    listen 443 ssl http2;
    server_name gea.example.com;
    ssl_certificate     /etc/ssl/certs/gea.example.com.crt;
    ssl_certificate_key /etc/ssl/private/gea.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;      # a long job wait (approvals) can take minutes
    }
}
server {
    listen 80;
    server_name gea.example.com;
    return 301 https://$host$request_uri;
}
