name: ci
on: [push, pull_request]
jobs:
  accept:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: python -m gea accept
      - run: python tools/standalone_check.py
      - name: GEA Reader reads every dossier as verify_dossier.py does
        run: |
          python tools/reader_fixtures.py "$RUNNER_TEMP/reader"
          node tools/reader_check.mjs "$RUNNER_TEMP/reader"
      - run: pytest -q
