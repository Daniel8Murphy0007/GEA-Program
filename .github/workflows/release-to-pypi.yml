name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # PyPI Trusted Publisher (OIDC): no token stored anywhere

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools and the package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install .
      - name: Product gate before publishing
        run: python -m gea accept
      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PKG_VERSION=$(python -c "import gea; print(gea.__version__)")
          echo "TAG=$TAG_VERSION  PYPROJECT=$PYPROJECT_VERSION  PACKAGE=$PKG_VERSION"
          [ "$TAG_VERSION" = "$PYPROJECT_VERSION" ] || { echo "tag != pyproject version"; exit 1; }
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "tag != gea.__version__"; exit 1; }
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify the wheel carries the package data and installs clean
        run: |
          python -m zipfile -l dist/*.whl | grep -c "gea/catalog/" | xargs -I{} sh -c '[ {} -gt 100 ] || { echo "catalogue missing from wheel"; exit 1; }'
          python -m zipfile -l dist/*.whl | grep -q "gea/help/TESTER_GUIDE.md" || { echo "tester guide missing from wheel"; exit 1; }
          python -m zipfile -l dist/*.whl | grep -c "gea/help/" | xargs -I{} sh -c '[ {} -ge 15 ] || { echo "help pages missing from wheel"; exit 1; }'
          pip install --force-reinstall dist/*.whl
          cd /tmp && gea docs && gea guide | head -3 && gea help drift | head -3
      - name: Twine check
        run: twine check dist/*
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
