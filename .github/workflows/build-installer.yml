name: Build the standalone install kit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # to attach the kit to the GitHub release of the tag

jobs:
  windows-kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the kit (embeddable Python + every wheel + scripts)
        run: python tools/build_installer.py --extras live,plotting,xls
      - name: Install the kit the way a client does, then run its gate
        shell: cmd
        run: |
          cd dist\gea-program-*-win64 || exit /b 1
          call install.cmd || exit /b 1
          call verify.cmd || exit /b 1
      - name: Attach the kit to the release of this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file SHIP_MESSAGE.txt
          gh release upload "$TAG" dist/gea-program-*-win64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: gea-program-win64-kit
          path: dist/gea-program-*-win64.zip
  linux-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Linux kit
        run: python tools/build_installer.py --platform linux --extras live,plotting,xls
      - name: Install it offline and run its gate
        run: |
          cd dist/gea-program-*-linux-*/ && ./install.sh && ./verify.sh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file SHIP_MESSAGE.txt
          gh release upload "$TAG" dist/gea-program-*-linux-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
