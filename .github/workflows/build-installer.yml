name: Build the standalone install kit

# One run per ship. Every ship pushes main and the tag together, so a push trigger on main built the same
# commit a second time and the two runs raced each other to the same release - v0.13.0 (the main run's upload
# lost), v0.16.0 (the tag run's create lost), v0.17.0 (the tag run's upload lost): a red step every time,
# with the kits on the release. The workflow now runs on the tag alone, and by hand. The attach step then has
# one writer: a tag run attaches to its own release, replacing; a manual run with release_tag attaches to
# that tag, replacing; a manual run with no tag attaches to the release of the version in pyproject.toml
# only where a kit is missing (a failed tag run's gap, filled by hand). A concurrency group on the commit
# serialises a manual run that overlaps a tag run, so even then the two never write at once.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "attach the kits to this existing release tag (e.g. v0.5.0), replacing its kits; empty = attach only where a kit is missing"
        required: false
        default: ""

concurrency:
  group: kit-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write   # to attach the kit to the GitHub release of the tag

jobs:
  windows-kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the tags: the attach step names the release from them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the kit (embeddable Python + every wheel + scripts)
        run: python tools/build_installer.py --extras live,plotting,xls,desktop
      - name: Install the kit the way a client does, then run its gate
        shell: cmd
        run: |
          rem cmd.exe's cd does not expand wildcards - resolve the kit folder first (this line failed the v0.4.0 run)
          set "KIT="
          for /d %%d in (dist\gea-program-*-win64) do set "KIT=%%d"
          if not defined KIT ( echo no kit folder under dist\ & dir dist & exit /b 1 )
          cd /d "%KIT%" || exit /b 1
          call install.cmd || exit /b 1
          call verify.cmd || exit /b 1
      - name: Attach the kit to the release
        shell: bash
        run: bash .github/workflows/attach-kit.sh "${{ inputs.release_tag }}" "dist/gea-program-*-win64.zip" "-win64.zip"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: gea-program-win64-kit
          path: dist/gea-program-*-win64.zip
  linux-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Linux kit
        run: python tools/build_installer.py --platform linux --extras live,plotting,xls,desktop
      - name: Install it offline and run its gate
        run: |
          cd dist/gea-program-*-linux-*/ && ./install.sh && ./verify.sh
      - name: Attach to the release
        run: bash .github/workflows/attach-kit.sh "${{ inputs.release_tag }}" "dist/gea-program-*-linux-*.zip" "-linux-"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: gea-program-linux-kit
          path: dist/gea-program-*-linux-*.zip
